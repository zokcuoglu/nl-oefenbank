<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luisteren A2 · NL Oefenbank</title>
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../css/site.css">
<style>
.frrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.frrow:last-child{border-bottom:0} .frrow:hover b{color:var(--accent)}
.frrow .nr{font-family:var(--mono);font-size:13px;color:var(--muted);width:1.6em;text-align:right}
.player{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--sunk);border-radius:12px;padding:16px}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:24px;cursor:pointer;flex:none}
.play:disabled{opacity:.4;cursor:default} .play.on{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.qq{font-size:19px;font-weight:500;line-height:1.5;margin:0}
.timerbar{position:sticky;top:0;z-index:5;background:var(--ground);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0}
.dots{display:flex;gap:3px;flex-wrap:wrap} .dots button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-family:var(--mono)}
.dots button.on{border-color:var(--accent);outline:2px solid var(--accent)} .dots button.done{background:var(--accent-soft)}
.dots button.ok{background:var(--ok-soft);border-color:var(--ok)} .dots button.no{background:var(--bad-soft);border-color:var(--bad)}
.timer{font-family:var(--mono);font-size:18px;font-weight:600} .timer.low{color:var(--bad)}
.script{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15.5px;line-height:1.6}
.script p{margin:2px 0} .script .who{display:inline-block;min-width:4.5em;color:var(--muted);font-size:13px;font-family:var(--mono)}
.script mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 2px}
</style>
<script>
// Watchdog: explain on screen when the login module cannot load (network block)
setTimeout(function () {
  if (window.__coreReady) return;
  var d = document.createElement("div");
  d.setAttribute("style", "position:fixed;left:16px;right:16px;bottom:16px;z-index:200;background:#F7ECD6;color:#7a4e0c;border-radius:10px;padding:14px 16px;font:15px/1.5 system-ui,sans-serif;max-width:640px;margin:0 auto");
  d.innerHTML = "<b>Sayfa yüklenemedi.</b> Giriş sistemi (Google/Firebase) indirilemedi. Ctrl+Shift+R ile yenile. Ağ veya reklam engelleyici Google'ı engelliyor olabilir.";
  document.body.appendChild(d);
}, 10000);
</script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><small><a href="../">← Ana sayfa</a> · <span lang="nl">Inburgeringsexamen A2</span></small><h1>Luisteren A2</h1></div>
    <div class="navlinks" id="ub"></div>
  </div>
</header>
<div class="wrap"><main id="app"><p class="muted">Yükleniyor…</p></main></div>

<script type="module">
// A2 listening practice. Each fragment (dialogue or announcement) is read aloud by the browser's Dutch voice;
// speakers get different voices or pitches. Practice mode: one fragment, feedback right away, replay as often as you like.
// Exam mode: 20 fragments, 45 minutes, each fragment can be played twice (our choice, to keep it exam-like),
// no feedback until the end. Rounds are saved as attempts (module "luisteren-a2").
import { gate, userBox, esc, saveAttempt, loadAttempts } from "../js/core.js";

const app = document.getElementById("app");
const params = () => new URLSearchParams(location.search);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const mmss = s => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.max(0, s) % 60).padStart(2, "0")}`;
const tone = p => p >= 80 ? "ok" : p >= 60 ? "warn" : "bad";
const WHO = { v: "vrouw", v2: "vrouw 2", m: "man", o: "omroep" };
const MAX_PLAYS = 2;

const { user, profile } = await gate({ area: "nt2", title: "Luisteren A2", seen: "luisteren-a2" });
document.getElementById("ub").innerHTML = userBox(user, profile);
let D;
try { D = await (await fetch("../data/luisteren-a2.json", { cache: "no-cache" })).json(); }
catch (e) { app.innerHTML = `<div class="notice">Fragmanlar yüklenemedi: ${esc(e.message)}</div>`; throw e; }
const frById = {}, examOf = {};
D.examens.forEach(e => e.fragmenten.forEach(f => { frById[f.id] = f; examOf[f.id] = e.id; }));
const examById = Object.fromEntries(D.examens.map(e => [e.id, e]));
let attempts = await loadAttempts(user.uid, "luisteren-a2").catch(() => []);

// ---------- Voices ----------
// Dutch voices of this browser/device; speakers get different voices when there are several, else a different pitch
const hasTTS = "speechSynthesis" in window;
let nlVoices = [];
function loadVoices() { nlVoices = hasTTS ? speechSynthesis.getVoices().filter(v => /^nl(-|_|$)/i.test(v.lang)) : []; }
if (hasTTS) { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); if (!S.run) render(); }; }
const VOICE = { v: [0, 1.1], v2: [2, 1.3], m: [1, 0.8], o: [2, 1.0] };  // [voice index, pitch]
function speakLines(lines, onEnd) {
  speechSynthesis.cancel();
  lines.forEach(([who, text], i) => {
    const u = new SpeechSynthesisUtterance(text), [vi, pitch] = VOICE[who] || [0, 1];
    u.lang = "nl-NL"; u.rate = 0.88; u.pitch = pitch;
    if (nlVoices.length) u.voice = nlVoices[vi % nlVoices.length];
    if (i === lines.length - 1) u.onend = onEnd;
    speechSynthesis.speak(u);
  });
}

// ---------- State ----------
// S.run = { test, ids, cur, order:{id:[i]}, ans:{id:i}, plays:{id:n}, exam, started, done, saved }
const S = { run: null, timer: null, playing: false };
function startRun(test, ids, exam) {
  S.run = { test, ids, cur: 0, order: Object.fromEntries(ids.map(id => [id, shuffle([0, 1, 2])])), ans: {}, plays: {}, exam, started: Date.now(), limit: 45 * 60, done: false, saved: false };
  clearInterval(S.timer);
  if (exam) S.timer = setInterval(() => { const r = S.run; if (!r || r.done) return; const el = document.getElementById("timer"), s = left();
    if (el) { el.textContent = mmss(s); el.classList.toggle("low", s <= 300); } if (s <= 0) finish(true); }, 1000);
}
const left = () => S.run.limit - Math.floor((Date.now() - S.run.started) / 1000);
const lastOf = test => attempts.find(a => a.test === test);

// ---------- Views ----------
function vList() {
  return `<section class="panel"><span class="eyebrow">Inburgeringsexamen A2</span><h2 style="margin:4px 0 8px">Dinleme sınavına hazırlık</h2>
      <p class="muted" style="margin:0;max-width:68ch">A2 Luisteren sınavı bilgisayarda, 45 dakika: kısa videolar ve konuşmalar, çoktan seçmeli sorular. Burada video yok; konuşmaları tarayıcının Hollandaca sesi okuyor. Tek fragmanla alıştırma yaparsan istediğin kadar dinlersin ve cevabı hemen görürsün. Tam sınavda 20 fragman var, her biri en fazla ${MAX_PLAYS} kez dinlenebilir ve sonuçlar sonda görünür. Konuşmalar bu sınav tarzında yazılmış alıştırmalardır; isimler uydurmadır.</p>
      ${!hasTTS ? `<div class="notice" style="margin-top:10px">Bu tarayıcı sesli okumayı desteklemiyor. Chrome, Edge ya da Safari'de aç.</div>`
        : !nlVoices.length ? `<div class="notice" style="margin-top:10px">Bu cihazda Hollandaca ses bulunamadı; okuma başka bir dilin sesiyle olabilir. Bilgisayarda Chrome ya da Edge en iyi sonucu verir.</div>`
        : `<p class="muted" style="font-size:13px;margin:10px 0 0">Bu cihazda ${nlVoices.length} Hollandaca ses var${nlVoices.length < 2 ? " (konuşmacılar ses tonuyla ayrılıyor)" : ""}.</p>`}</section>
    ${D.examens.map(e => { const l = lastOf(e.id);
      return `<section class="panel"><div class="sectionhead"><h3 lang="nl">${esc(e.titel)}</h3>
        <span class="row">${l ? `<span class="chip ${tone(Math.round(100 * l.score / l.total))} num">son: ${l.score}/${l.total}</span>` : ""}<a class="btn primary" style="text-decoration:none" href="?examen=${e.id}">Tam sınav (${e.minuten} dk)</a></span></div>
      ${e.fragmenten.map((f, k) => { const lf = lastOf(f.id); return `<a class="frrow" href="?f=${f.id}"><span class="nr">${k + 1}</span><span lang="nl">${esc(f.intro)}</span>
        ${lf ? `<span class="chip ${lf.score ? "ok" : "bad"}">${lf.score ? "doğru" : "yanlış"}</span>` : `<span class="chip">yeni</span>`}</a>`; }).join("")}</section>`; }).join("")}`;
}
function script(f, showProof) {
  return `<div class="script" lang="nl">${f.regels.map(([w, t]) => `<p><span class="who">${WHO[w]}</span>${showProof && t.includes(f.bewijs) ? esc(t).replace(esc(f.bewijs), `<mark>${esc(f.bewijs)}</mark>`) : esc(t)}</p>`).join("")}</div>`;
}
function vRun() {
  const r = S.run, f = frById[r.ids[r.cur]], a = r.ans[f.id], answered = a !== undefined;
  const feedback = r.done || (!r.exam && answered), plays = r.plays[f.id] || 0, canPlay = hasTTS && (!r.exam || r.done || plays < MAX_PLAYS);
  const res = r.done && r.exam ? (() => { const ok = r.ids.filter(id => r.ans[id] === 0).length, p = Math.round(100 * ok / r.ids.length);
    return `<section class="panel"><div class="row" style="gap:16px;align-items:flex-end"><div class="bigscore num" style="font-size:42px;font-weight:700;color:var(--${tone(p)})">%${p}</div>
      <div class="muted num">${ok} / ${r.ids.length} doğru${r.timeout ? " · süre doldu" : ""} · ${r.saved ? "kaydedildi" : "kaydediliyor…"}</div>
      <div style="margin-left:auto" class="row"><a class="btn" href="./" style="text-decoration:none">Listeye dön</a><button class="btn primary" data-act="again">Tekrar</button></div></div>
      <p class="muted" style="margin:8px 0 0;font-size:14px">Numaralara tıklayarak her fragmanın metnini, doğru cevabı ve açıklamayı gör.</p></section>`; })() : "";
  return `<div class="timerbar">
      ${r.exam ? `<div class="dots">${r.ids.map((id, i) => `<button class="${i === r.cur ? "on" : ""} ${r.done ? (r.ans[id] === 0 ? "ok" : "no") : id in r.ans ? "done" : ""}" data-act="go" data-i="${i}">${i + 1}</button>`).join("")}</div>` : `<a href="./">← Fragmanlar</a>`}
      <span style="margin-left:auto" class="row">${r.exam && !r.done ? `<span class="timer" id="timer">${mmss(left())}</span><button class="btn primary" data-act="finish">Bitir</button>` : ""}</span></div>
    <div id="finishmsg"></div>${res}
    <section class="panel" style="display:flex;flex-direction:column;gap:14px">
      <span class="eyebrow">Fragment ${r.cur + 1}${r.exam ? ` / ${r.ids.length}` : ""}</span>
      <div class="player"><button class="play ${S.playing ? "on" : ""}" data-act="play" ${canPlay && !S.playing ? "" : "disabled"} aria-label="Dinle">${S.playing ? "♪" : "▶"}</button>
        <div><b lang="nl">${esc(f.intro)}</b><br><span class="muted" style="font-size:13.5px">${r.exam && !r.done ? `${MAX_PLAYS - plays} dinleme hakkın kaldı` : "İstediğin kadar dinleyebilirsin"}</span></div></div>
      <p class="qq" lang="nl">${esc(f.vraag)}</p>
      <div class="opts">${r.order[f.id].map((oi, k) => { const cls = feedback ? (oi === 0 ? "right" : oi === a ? "wrongpick" : "") : (a === oi ? "sel" : "");
        return `<button class="opt ${cls}" data-act="ans" data-o="${oi}" ${feedback ? "disabled" : ""}><span class="mark">${"ABC"[k]}</span><span lang="nl">${esc(f.opties[oi])}</span></button>`; }).join("")}</div>
      ${feedback ? `<div class="why"><b>${a === 0 ? "Doğru!" : a === undefined ? "Boş." : "Yanlış."}</b> ${esc(f.uitleg)}</div>
        <details ${r.exam ? "" : "open"}><summary style="cursor:pointer;color:var(--blue);font-weight:600">Konuşmanın metni</summary>${script(f, true)}</details>` : ""}
      <div class="row">${r.exam ? `${r.cur > 0 ? `<button class="btn" data-act="go" data-i="${r.cur - 1}">‹ Önceki</button>` : ""}${r.cur < r.ids.length - 1 ? `<button class="btn primary" data-act="go" data-i="${r.cur + 1}">Sonraki →</button>` : ""}`
        : feedback ? `${nextSingle(f) ? `<a class="btn primary" style="text-decoration:none" href="?f=${nextSingle(f)}">Sonraki fragman →</a>` : ""}<a class="btn" href="./" style="text-decoration:none">Listeye dön</a>` : ""}</div>
    </section>`;
}
const nextSingle = f => { const e = examById[examOf[f.id]], i = e.fragmenten.findIndex(x => x.id === f.id); return e.fragmenten[i + 1]?.id; };

// ---------- Finish & save ----------
async function finish(timeout = false) {
  const r = S.run; if (r.done) return;
  r.done = true; r.timeout = timeout; clearInterval(S.timer); if (hasTTS) speechSynthesis.cancel(); S.playing = false;
  render(); scrollTo(0, 0);
  await save();
}
async function save() {
  const r = S.run, answers = r.ids.map(id => ({ qid: id, chosen: id in r.ans ? String(r.ans[id]) : "", correct: r.ans[id] === 0 }));
  const attempt = { kind: r.exam ? "examen" : "fragment", test: r.test, title: r.exam ? examById[r.test].titel : frById[r.test].intro,
    started_at: new Date(r.started).toISOString(), finished_at: new Date().toISOString(), duration_s: Math.round((Date.now() - r.started) / 1000),
    score: answers.filter(a => a.correct).length, total: answers.length, answers };
  try { await saveAttempt(user.uid, "luisteren-a2", attempt); attempts.unshift(attempt); r.saved = true; } catch (e) { console.warn(e); }
  if (r.exam) render();
}

// ---------- Render & events ----------
function render() {
  const p = params();
  if (S.run) { app.innerHTML = vRun(); return; }
  const ex = examById[p.get("examen")];
  if (ex) { startRun(ex.id, ex.fragmenten.map(f => f.id), true); app.innerHTML = vRun(); return; }
  if (frById[p.get("f")]) { startRun(p.get("f"), [p.get("f")], false); app.innerHTML = vRun(); return; }
  app.innerHTML = vList();
}
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const r = S.run;
  switch (el.dataset.act) {
    case "play": { const f = frById[r.ids[r.cur]]; if (!r.done) r.plays[f.id] = (r.plays[f.id] || 0) + 1; S.playing = true; render();
      speakLines(f.regels, () => { S.playing = false; if (S.run === r) render(); }); break; }
    case "ans": { const f = frById[r.ids[r.cur]]; if (!r.exam && r.ans[f.id] !== undefined) break;
      r.ans[f.id] = +el.dataset.o; render(); if (!r.exam) { r.done = true; save().then(render); } break; }
    case "go": if (hasTTS) speechSynthesis.cancel(); S.playing = false; r.cur = +el.dataset.i; render(); break;
    case "finish": { const open = r.ids.filter(id => !(id in r.ans)).length, box = document.getElementById("finishmsg");
      if (open && !el.dataset.sure) { box.innerHTML = `<div class="notice" style="margin:8px 0">${open} soru boş. Yine de bitirmek istiyor musun? <button class="btn primary" data-act="finish" data-sure="1" style="margin-left:8px">Evet, bitir</button></div>`; break; }
      finish(); break; }
    case "again": { const t = r.test, ex = r.exam; S.run = null; startRun(t, ex ? examById[t].fragmenten.map(f => f.id) : [t], ex); render(); scrollTo(0, 0); break; }
  }
});
addEventListener("popstate", () => { S.run = null; render(); });
render();
</script>
</body>
</html>
