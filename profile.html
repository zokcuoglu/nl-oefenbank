<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#C8551B">
<title>Profil · NL Oefenbank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/site.css">
<script>
// Watchdog: if the login module has not loaded after 10 s (network block, old cache), explain it on screen
setTimeout(function () {
  if (window.__coreReady) return;
  var d = document.createElement("div");
  d.setAttribute("style", "position:fixed;left:16px;right:16px;bottom:16px;z-index:200;background:#F7ECD6;color:#7a4e0c;border-radius:10px;padding:14px 16px;font:15px/1.5 system-ui,sans-serif;max-width:640px;margin:0 auto");
  d.innerHTML = "<b>Sayfa yüklenemedi.</b> Giriş sistemi (Google/Firebase) indirilemedi. Ctrl+Shift+R ile yenile. Reklam engelleyici varsa bu site için kapat. Devam ederse F12 → Console'daki kırmızı satırların ekran görüntüsünü Zana'ya gönder.";
  document.body.appendChild(d);
}, 10000);
</script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><small><a href="./">← Ana sayfa</a></small><h1>Profil</h1></div>
    <div class="navlinks" id="ub"></div>
  </div>
</header>
<div class="wrap"><main id="app"><p class="muted">Yükleniyor…</p></main></div>

<script type="module">
// Profile: own name, groep (children), exam dates (adults), e-mail choices and own statistics.
// Type and role are shown read-only: only an admin can change them.
import { gate, userBox, esc, updateProfile, loadAllAttempts, TYPES, ROLES, roleOf } from "./js/core.js";
import { summarize, pct, recentRounds, streak, dayBars, scoreChips } from "./js/stats.js";

const app = document.getElementById("app");
const { user, profile } = await gate({ area: "any" });
document.getElementById("ub").innerHTML = userBox(user, profile);

const cat = await (await fetch("data/catalog.json", { cache: "no-cache" })).json();
const attempts = await loadAllAttempts(user.uid).catch(() => []);
const isChild = profile.type === "child";
const examMods = cat.modules.filter(m => m.area === "nt2" && m.exam);
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString("tr-TR", { day: "2-digit", month: "short", year: "numeric" }); } catch (e) { return ""; } };

// Own statistics: totals, activity per day, per exercise, and per news item / test
const st = summarize(attempts);
const titleOf = id => cat.modules.find(m => m.id === id)?.title || id;
// News titles come from the news data file (only needed when there are news rounds)
let newsTitle = {}, catOf = {};
if (!isChild && st.byModule.nieuws) {
  try { const n = await (await fetch("data/nieuws.json", { cache: "no-cache" })).json();
    newsTitle = Object.fromEntries([...n.items.map(i => [i.id, `#${i.nr} ${i.titel}`]), ...(n.toetsen || []).map(t => [t.id, t.titel])]);
    // qid "<item or test>:<question>" -> category, for the strengths/weaknesses block
    n.items.forEach(i => i.toets.forEach(q => catOf[i.id + ":" + q.id] = q.cat));
    (n.toetsen || []).forEach(t => t.extra.forEach(q => catOf[t.id + ":" + q.id] = q.cat)); } catch (e) {}
}
// News quiz answers per category (anlama, kelime, deyim, gramer): shows where to practise more
const CATNAME = { begrip: "Anlama", woorden: "Kelime", uitdrukkingen: "Deyim", grammatica: "Gramer" };
const byCat = {};
attempts.filter(a => a.module === "nieuws").forEach(a => (a.answers || []).forEach(x => { const c = catOf[x.qid]; if (!c) return; const v = byCat[c] = byCat[c] || { ok: 0, n: 0 }; v.n++; if (x.correct) v.ok++; }));
const newsRows = Object.values(st.byTest).filter(t => t.module === "nieuws").sort((a, b) => b.last.localeCompare(a.last));
const tone = p => p >= 80 ? "ok" : p >= 60 ? "warn" : "bad";
const statsHtml = st.rounds ? `
    <section class="kpis">
      <div class="panel kpi"><div class="eyebrow">Toplam tur</div><div class="v num">${st.rounds}</div></div>
      <div class="panel kpi"><div class="eyebrow">Doğruluk</div><div class="v num" style="color:var(--${tone(pct(st.ok, st.tot))})">%${pct(st.ok, st.tot)}</div></div>
      <div class="panel kpi"><div class="eyebrow">Son 7 gün</div><div class="v num">${recentRounds(st, 7)} <small style="font-size:14px" class="muted">tur</small></div></div>
      <div class="panel kpi"><div class="eyebrow">Seri</div><div class="v num">${streak(st)} <small style="font-size:14px" class="muted">gün</small></div></div>
    </section>
    <section class="panel"><div class="sectionhead"><h3>Son 14 gün</h3><span class="muted">günde kaç tur</span></div>${dayBars(st, 14)}</section>
    <section class="panel"><div class="sectionhead"><h3>Alıştırmalar</h3><span class="muted">${Object.keys(st.byModule).length} alıştırma</span></div>
      <div class="tablewrap"><table><thead><tr><th>Alıştırma</th><th class="r">Tur</th><th>Doğruluk</th><th class="r">Son</th></tr></thead><tbody>
      ${Object.entries(st.byModule).sort((a, b) => b[1].rounds - a[1].rounds).map(([id, m]) => { const p = pct(m.ok, m.tot); return `<tr><td>${esc(titleOf(id))}</td><td class="r num">${m.rounds}</td>
        <td><span class="bar minibar"><i style="width:${p}%;background:var(--${tone(p)})"></i></span><span class="num">%${p}</span></td><td class="r num muted">${fmtDate(m.last)}</td></tr>`; }).join("")}
      </tbody></table></div></section>
    ${newsRows.length ? `<section class="panel"><div class="sectionhead"><h3 lang="nl">Nieuws in niveaus</h3><span class="muted">quiz ve sınavlar</span></div>
      <div class="tablewrap"><table><thead><tr><th>Haber / sınav</th><th class="r">Deneme</th><th class="r">En iyi (seviyeye göre)</th><th class="r">Son</th></tr></thead><tbody>
      ${newsRows.map(t => `<tr><td><a href="nieuws/?${t.test.startsWith("toets") ? "toets" : "id"}=${encodeURIComponent(t.test)}" lang="nl">${esc(newsTitle[t.test] || t.test)}</a></td><td class="r num">${t.rounds}</td>
        <td class="r">${scoreChips(attempts.filter(a => a.module === "nieuws"), t.test)}</td><td class="r num muted">%${Math.round(100 * t.lastPct)}</td></tr>`).join("")}
      </tbody></table></div>
      ${Object.keys(byCat).length ? `<div style="margin-top:16px"><span class="eyebrow">Haber quiz'lerinde alanlara göre</span><div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${Object.entries(byCat).map(([c, v]) => { const p = pct(v.ok, v.n); return `<div class="catrow"><span>${CATNAME[c]}</span><div class="bar"><i style="width:${p}%;background:var(--${tone(p)})"></i></div><span class="num r">%${p} <span class="muted">(${v.n})</span></span></div>`; }).join("")}</div></div>` : ""}</section>` : ""}` :
  `<section class="panel"><span class="eyebrow">İstatistik</span><p class="muted" style="margin:6px 0 0">Henüz bitirilmiş tur yok. İlk turu bitirince burada toplam, doğruluk, günlük aktivite ve alıştırma bazında sonuçların görünecek.</p></section>`;

app.innerHTML = `
  <section class="panel"><span class="eyebrow">Hesap</span>
    <div class="formgrid" style="margin-top:10px">
      <div class="field"><label for="p-name">Görünen ad</label><input class="input" id="p-name" value="${esc(profile.name || user.displayName || "")}"></div>
      <div class="field"><label>E-posta</label><span>${esc(user.email || "")}</span></div>
      <div class="field"><label>Hesap tipi</label><span>${esc(TYPES[profile.type] || "-")}</span></div>
      <div class="field"><label>Rol</label><span>${esc(ROLES[roleOf(profile)])}</span></div>
      <div class="field"><label for="p-weekly">E-posta</label><label class="switch" style="color:var(--ink)"><input type="checkbox" id="p-weekly" ${profile.email_weekly === false ? "" : "checked"}> Haftalık özet gönder</label>
        ${isChild ? "" : `<label class="switch" style="color:var(--ink)"><input type="checkbox" id="p-news" ${(profile.email_news ?? profile.email_daily) ? "checked" : ""}> Haftalık haber e-postası</label>`}</div>
      ${isChild ? `<div class="field"><label for="p-groep">Okul grubu</label><select class="input" id="p-groep"><option value="">Seç</option>${Object.entries(cat.groups).map(([k, v]) => `<option value="${k}" ${profile.groep === k ? "selected" : ""}>${esc(v)}</option>`).join("")}</select></div>` : ""}
    </div>
    <p class="muted" style="font-size:13px;margin:12px 0 0">Hesap tipi ve rol sadece admin tarafından değiştirilebilir.</p>
  </section>
  ${isChild ? "" : `<section class="panel"><span class="eyebrow">Sınav tarihleri</span>
    <p class="muted" style="margin:6px 0 12px">Geri sayım ana sayfada ve ilgili alıştırmada görünür. Boş bırakabilirsin.</p>
    <div class="formgrid">${examMods.map(m => `<div class="field"><label for="d-${m.id}">${esc(m.title)}</label>
      <input class="input" type="date" id="d-${m.id}" value="${esc(profile.exams?.[m.id] || (m.id === "lezen" ? profile.exam_date || "" : ""))}"></div>`).join("")}</div></section>`}
  <div class="row"><button class="btn primary" id="save">Kaydet</button><span id="msg"></span></div>
  <h2 style="margin:8px 0 0">İstatistiklerim</h2>
  ${statsHtml}
  <section class="panel"><span class="eyebrow">Sınıflar</span><p class="muted" style="margin:6px 0 0">Sınıf özelliği yakında eklenecek. Sınıf arkadaşların ilerleme özetini burada göreceksin.</p></section>`;

document.getElementById("save").onclick = async () => {
  const msg = document.getElementById("msg");
  const data = { name: document.getElementById("p-name").value.trim(), email_weekly: document.getElementById("p-weekly").checked };
  if (!isChild) data.email_news = document.getElementById("p-news").checked;
  if (isChild) data.groep = document.getElementById("p-groep").value || null;
  else data.exams = Object.fromEntries(examMods.map(m => [m.id, document.getElementById("d-" + m.id).value || null]));
  try { await updateProfile(user.uid, data); msg.innerHTML = `<span class="ok-msg">Kaydedildi.</span>`; }
  catch (e) { msg.innerHTML = `<span class="err-msg">Kaydedilemedi: ${esc(e.code || e.message)}</span>`; }
};
</script>
</body>
</html>
