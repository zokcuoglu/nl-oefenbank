# Sends the site's e-mails (see scripts/mailer.py).
#   every hour : approval mails + queued announcements, and the news / weekly summary
#                when the schedule on the admin page says so (Firestore settings/mail)
#   manual run : Actions > Mailer > Run workflow (dry run by default: prints, sends nothing)
#                mode "test": preview mails to one address only (default: the sending Gmail), writes nothing
name: Mailer

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = örnek e-postaları sadece test adresine gönder; hourly = normal çalışma; news / weekly = herkese şimdi gönder; groep = çocukları şimdi bir üst gruba geçir (önce 'Sadece göster' ile dene)"
        type: choice
        options: [test, hourly, news, weekly, groep]
        default: test
      test_to:
        description: "Test e-postası nereye gitsin? Boş bırak = nloefenbank@gmail.com (repo herkese açık; buraya yazılan adres loglarda görünebilir)"
        type: string
        default: ""
      dry_run:
        description: "Sadece göster, gönderme (test modunda dikkate alınmaz)"
        type: boolean
        default: true

concurrency:
  group: mailer
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install firebase-admin
      - name: Run mailer
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'hourly' }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST_TO: ${{ inputs.test_to }}
        run: python scripts/mailer.py --mode "$MODE" $DRY
