# Sends the site's e-mails (see scripts/mailer.py).
#   every hour : approval mails + queued announcements, and the news / weekly summary
#                when the schedule on the admin page says so (Firestore settings/mail)
#   manual run : Actions > Mailer > Run workflow (dry run by default: prints, sends nothing)
name: Mailer

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "hourly = normal run (schedule decides), news = haberi şimdi gönder, weekly = özeti şimdi gönder"
        type: choice
        options: [hourly, news, weekly]
        default: hourly
      dry_run:
        description: "Sadece göster, gönderme"
        type: boolean
        default: true

concurrency:
  group: mailer
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install firebase-admin
      - name: Run mailer
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'hourly' }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/mailer.py --mode "$MODE" $DRY
