<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<meta name="theme-color" content="#C8551B">
<title>Woordkaarten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Same worksheet look as the other kids pages (kids/g5/eer-oor-eur.html) */
:root{
  --paper:#eef3fb;--card:#ffffff;--ink:#1d2a4d;--muted:#5b6788;--line:#c9d4ea;
  --accent:#ffd84d;--accent-ink:#1d2a4d;--good:#1f8a4c;--good-bg:#e1f5e8;--bad:#c4372e;--bad-bg:#fde6e3;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;--f-body:"Andika","Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121a2e;--card:#1b2540;--ink:#e6ecfa;--muted:#9aa6c4;--line:#2e3a5c;
  --accent:#f5cf3a;--accent-ink:#1d2a4d;--good:#5fd18e;--good-bg:#173a28;--bad:#ff8077;--bad-bg:#45201d;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121a2e;--card:#1b2540;--ink:#e6ecfa;--muted:#9aa6c4;--line:#2e3a5c;
  --accent:#f5cf3a;--accent-ink:#1d2a4d;--good:#5fd18e;--good-bg:#173a28;--bad:#ff8077;--bad-bg:#45201d;color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6vw,40px);font-weight:700}
h1 mark{background:linear-gradient(transparent 55%,var(--accent) 55%);color:inherit;padding:0 .1em}
.sub{color:var(--muted);margin:.25rem 0 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sitebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;font-size:15px}
.sitebar a{color:var(--ink)}
.label{font-family:var(--f-display);font-weight:600;margin:22px 0 8px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{background:var(--card);border:none;padding:8px 14px;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.mode{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--ink);transform:translateY(-2px)}
.mode h3{font-size:21px}.mode p{margin:0;color:var(--muted);font-size:15px}
.best{font-size:14px;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;padding:12px 22px;font-family:var(--f-display);font-weight:600;font-size:18px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chip{font-family:var(--f-display);font-weight:600;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.progress{height:8px;background:var(--line);border-radius:99px;margin:14px 0 22px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;justify-content:center}

/* Results */
.summary{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;flex:1 1 140px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.rbox{background:var(--card);border:2px solid var(--bad);border-radius:14px;padding:12px 14px}
.rbox b{font-family:var(--f-display);font-size:19px}
.rbox p{margin:4px 0 0;font-size:15px}
.saveerr{color:var(--bad);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>
// Watchdog: if the login module has not loaded after 10 s (network block, old cache), explain it on screen
setTimeout(function () {
  if (window.__coreReady) return;
  var d = document.createElement("div");
  d.setAttribute("style", "position:fixed;left:16px;right:16px;bottom:16px;z-index:200;background:#F7ECD6;color:#7a4e0c;border-radius:10px;padding:14px 16px;font:15px/1.5 system-ui,sans-serif;max-width:640px;margin:0 auto");
  d.innerHTML = "<b>Sayfa yüklenemedi.</b> Giriş sistemi (Google/Firebase) indirilemedi. Ctrl+Shift+R ile yenile. Reklam engelleyici varsa bu site için kapat.";
  document.body.appendChild(d);
}, 10000);
</script>
</head>
<body>
<div class="wrap">
  <div class="sitebar"><a href="../">← Ana sayfa</a><span id="ub"></span></div>

  <!-- MENU: choose what the back of a card / the matching tile shows, then a mode -->
  <section id="menu">
    <h1 id="mTitle">Woord<mark>kaarten</mark></h1>
    <p class="sub" id="mSub"></p>
    <p class="sub" id="mStatus"></p>
    <div class="label">Wat staat er op de achterkant?</div>
    <div class="seg" id="sideSeg">
      <button data-side="def">Uitleg (NL)</button>
      <button data-side="tr">Türkçe</button>
    </div>
    <div class="label">Kies een spel</div>
    <div class="modes">
      <button class="mode" id="goCards"><h3>🃏 Kaartjes</h3><p>Draai de kaart om. Weet je het? Of nog oefenen? Moeilijke kaarten komen terug.</p><span class="best" id="bestCards"></span></button>
      <button class="mode" id="goMatch"><h3>🧩 Koppelen</h3><p>Zoek de paren: woord en betekenis. Zo snel mogelijk, met weinig fouten.</p><span class="best" id="bestMatch"></span></button>
      <a class="mode" id="goToets"><h3>✏️ Toets</h3><p>De gewone woordentest, alleen met deze woorden.</p></a>
    </div>
  </section>

  <!-- PLAY: flashcards or matching game, drawn by js/oefen.js -->
  <section id="play" hidden></section>

  <!-- RESULT (Turkish explanation for the parent, like the other kids pages) -->
  <section id="result" hidden>
    <h1 id="rTitle"></h1>
    <div class="summary" id="rStats"></div>
    <div id="rListBox"><div class="label">Bunlar henüz zor / Nog oefenen</div><div class="list" id="rList"></div></div>
    <div class="actions">
      <button class="btn" id="rAgain">Nog een keer</button>
      <button class="btn ghost" data-quit>Menu</button>
    </div>
  </section>
</div>

<script type="module">
import { gate, userBox, saveAttempt, loadAllAttempts, esc } from "../js/core.js";
import { mountCards, mountMatch, wordStatus, statusOf, STATUS, STATUS_ORDER, shuffle, fmtTime as fmt } from "../js/oefen.js";

// Which school list: ?lijst=weer -> the school words (bron "school") with thema "weer" from data/woorden.json
const LIJST = new URLSearchParams(location.search).get("lijst") || "weer";
const MODULE = "school-" + LIJST;        // same id as the card in data/catalog.json (titles in mail/admin)
const $ = id => document.getElementById(id);
const show = s => ["menu", "play", "result"].forEach(x => $(x).hidden = x !== s);

// Back side: Dutch definition (as on the school sheet) or Turkish meaning; remembered in this browser
let side = localStorage.getItem("woordkaarten:side") || "def";
function drawSide() { document.querySelectorAll("#sideSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.side === side)); }
document.querySelectorAll("#sideSeg button").forEach(b => b.onclick = () => { side = b.dataset.side; localStorage.setItem("woordkaarten:side", side); drawSide(); });

let WORDS = [], ALL = [], USER, game = null;
const mine = () => ALL.filter(a => a.module === MODULE);
// Weak words first, so "Alleen de moeilijke" and a new round start where it matters
const byStatus = list => { const st = wordStatus(ALL); return shuffle(list).sort((a, b) => STATUS_ORDER[statusOf(st, a.id)] - STATUS_ORDER[statusOf(st, b.id)]); };

// ---------- Menu ----------
function renderMenu() {
  game?.stop(); game = null;
  const lijst = WORDS[0]?.lijst || LIJST;
  $("mTitle").innerHTML = `Thema <mark>${esc(LIJST.charAt(0).toUpperCase() + LIJST.slice(1))}</mark>`;
  $("mSub").textContent = `${lijst} · ${WORDS.length} woorden`;
  // How many words he knows: from every saved round (cards, matching, word test)
  const st = wordStatus(ALL), count = k => WORDS.filter(w => statusOf(st, w.id) === k).length;
  $("mStatus").textContent = ["kent", "bezig", "zwak", "nieuw"].map(k => `${STATUS[k].icon} ${STATUS[k].label} ${count(k)}`).join(" · ");
  $("goToets").href = `../woorden/?lijst=${encodeURIComponent(LIJST)}`;
  const cards = mine().filter(a => a.test === "kaarten"), match = mine().filter(a => a.test === "koppelen");
  $("bestCards").textContent = cards.length ? `Beste: ${Math.max(...cards.map(a => a.score))}/${cards[0].total} meteen goed` : "";
  const fastest = match.filter(a => a.score === a.total).map(a => a.duration_ms);
  $("bestMatch").textContent = fastest.length ? `Record zonder fouten: ${fmt(Math.min(...fastest))}` : match.length ? `${match.length}× gespeeld` : "";
  drawSide();
  show("menu");
}
document.querySelectorAll("[data-quit]").forEach(b => b.onclick = renderMenu);

// ---------- Flashcards ----------
function startCards(list = WORDS) {
  show("play");
  game = mountCards($("play"), byStatus(list), { side, onQuit: renderMenu, onDone: ({ ms, first, words }) => {
    const right = words.filter(w => first[w.id]).length, hard = words.filter(w => !first[w.id]);
    save({ test: "kaarten", title: "Kaartjes", ms, score: right, total: words.length,
      answers: words.map(w => ({ qid: w.id, w: w.id, chosen: first[w.id] ? "ken ik" : "nog oefenen", correct: !!first[w.id] })) });
    result(`Alle kaarten gedaan!${right === words.length ? " 🎉" : ""}`,
      [[`${right}/${words.length}`, "Meteen goed / İlk seferde bildi"], [fmt(ms), "Tijd / Süre"]], hard, () => startCards(words));
    // Practise only the hard ones
    $("rAgain").textContent = hard.length ? "Alleen de moeilijke" : "Nog een keer";
    if (hard.length) $("rAgain").onclick = () => startCards(hard);
  } });
}

// ---------- Matching ----------
function startMatch() {
  show("play");
  game = mountMatch($("play"), WORDS, { side, onQuit: renderMenu, onDone: ({ ms, errors, wrong, words }) => {
    const hard = words.filter(w => wrong.has(w.id));
    save({ test: "koppelen", title: "Koppelen", ms, score: words.length - hard.length, total: words.length,
      answers: words.map(w => ({ qid: w.id, w: w.id, chosen: wrong.has(w.id) ? "fout" : "goed", correct: !wrong.has(w.id) })) });
    result(errors ? "Klaar!" : "Klaar zonder fouten! 🎉", [[fmt(ms), "Tijd / Süre"], [String(errors), "Fouten / Hata"]], hard, startMatch);
    $("rAgain").textContent = "Nog een keer";
  } });
}

// ---------- Result + saving ----------
function result(title, stats, hard, again) {
  $("rTitle").textContent = title;
  $("rStats").innerHTML = stats.map(([v, l]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("");
  $("rListBox").hidden = !hard.length;
  $("rList").innerHTML = hard.map(w => `<article class="rbox"><b lang="nl">${esc(w.nl)}</b>
    <p lang="nl">${esc(w.definitie || "")}</p><p><strong>Anlamı:</strong> ${esc(w.tr)}</p><p lang="nl"><em>${esc(w.voorbeeld)}</em></p></article>`).join("");
  $("rAgain").onclick = again;
  show("result");
}
function save({ test, title, ms, score, total, answers }) {
  const now = new Date();
  const attempt = { kind: "full", test, title, lijst: LIJST, side, module: MODULE,
    started_at: new Date(now - ms).toISOString(), finished_at: now.toISOString(),
    duration_s: Math.round(ms / 1000), duration_ms: ms, score, total, answers };
  ALL.unshift(attempt);
  saveAttempt(USER.uid, MODULE, attempt).catch(e =>
    $("rTitle").insertAdjacentHTML("afterend", `<p class="saveerr">Sonuç kaydedilemedi (${esc(e.code || "hata")}).</p>`));
}

$("goCards").onclick = () => startCards();
$("goMatch").onclick = () => startMatch();

// ---------- Start: login, then load the words of this list ----------
const { user, profile } = await gate({ area: "kids", title: "Woordkaarten", seen: MODULE });
USER = user;
$("ub").innerHTML = userBox(user, profile);
try {
  const data = await (await fetch("../data/woorden.json", { cache: "no-cache" })).json();
  WORDS = data.woorden.filter(w => w.bron === "school" && w.thema === LIJST);
} catch (e) { $("mSub").textContent = "Kelimeler yüklenemedi: " + e.message; throw e; }
if (!WORDS.length) { $("mSub").textContent = `Bu liste bulunamadı: ${LIJST}`; throw new Error("empty list"); }
ALL = await loadAllAttempts(user.uid).catch(() => []);   // all modules: the word test also counts for the status
renderMenu();
</script>
</body>
</html>
