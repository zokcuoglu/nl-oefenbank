<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<meta name="theme-color" content="#C8551B">
<title>Woordkaarten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Same worksheet look as the other kids pages (kids/g5/eer-oor-eur.html) */
:root{
  --paper:#eef3fb;--card:#ffffff;--ink:#1d2a4d;--muted:#5b6788;--line:#c9d4ea;
  --accent:#ffd84d;--accent-ink:#1d2a4d;--good:#1f8a4c;--good-bg:#e1f5e8;--bad:#c4372e;--bad-bg:#fde6e3;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;--f-body:"Andika","Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121a2e;--card:#1b2540;--ink:#e6ecfa;--muted:#9aa6c4;--line:#2e3a5c;
  --accent:#f5cf3a;--accent-ink:#1d2a4d;--good:#5fd18e;--good-bg:#173a28;--bad:#ff8077;--bad-bg:#45201d;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121a2e;--card:#1b2540;--ink:#e6ecfa;--muted:#9aa6c4;--line:#2e3a5c;
  --accent:#f5cf3a;--accent-ink:#1d2a4d;--good:#5fd18e;--good-bg:#173a28;--bad:#ff8077;--bad-bg:#45201d;color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6vw,40px);font-weight:700}
h1 mark{background:linear-gradient(transparent 55%,var(--accent) 55%);color:inherit;padding:0 .1em}
.sub{color:var(--muted);margin:.25rem 0 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sitebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;font-size:15px}
.sitebar a{color:var(--ink)}
.label{font-family:var(--f-display);font-weight:600;margin:22px 0 8px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{background:var(--card);border:none;padding:8px 14px;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.mode{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--ink);transform:translateY(-2px)}
.mode h3{font-size:21px}.mode p{margin:0;color:var(--muted);font-size:15px}
.best{font-size:14px;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;padding:12px 22px;font-family:var(--f-display);font-weight:600;font-size:18px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chip{font-family:var(--f-display);font-weight:600;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.progress{height:8px;background:var(--line);border-radius:99px;margin:14px 0 22px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;justify-content:center}

/* Flashcard: tap to flip (3D turn) */
.flip{perspective:1200px;height:clamp(260px,48vh,360px);cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.back .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:2px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px;text-align:center}
.face.b{transform:rotateY(180deg)}
.front-word{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,8vw,52px)}
.back-main{font-size:clamp(21px,4.6vw,28px);font-weight:700}
.back-sub{color:var(--muted);font-size:16px}
.ex{font-size:16px;border-left:3px solid var(--line);padding-left:10px;text-align:left;max-width:52ch}
.ex em{color:var(--muted)}
.tap{position:absolute;bottom:10px;font-size:13px;color:var(--muted)}
.say{position:absolute;top:10px;right:12px;background:none;border:none;font-size:22px}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.judge button{border-radius:14px;padding:14px;font-family:var(--f-display);font-weight:600;font-size:19px;border:2px solid}
.judge .no{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.judge .ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}

/* Matching game: two columns of tiles */
.match{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 10px;min-height:58px;font-size:16px;line-height:1.3;transition:background .15s,border-color .15s,opacity .3s}
.tile.w{font-family:var(--f-display);font-weight:600;font-size:19px}
.tile:hover:not(:disabled){border-color:var(--ink)}
.tile.sel{border-color:var(--ink);background:var(--accent);color:var(--accent-ink)}
.tile.ok{background:var(--good-bg);border-color:var(--good);color:var(--good);opacity:.45;cursor:default}
.tile.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Results */
.summary{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;flex:1 1 140px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.rbox{background:var(--card);border:2px solid var(--bad);border-radius:14px;padding:12px 14px}
.rbox b{font-family:var(--f-display);font-size:19px}
.rbox p{margin:4px 0 0;font-size:15px}
.saveerr{color:var(--bad);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>
// Watchdog: if the login module has not loaded after 10 s (network block, old cache), explain it on screen
setTimeout(function () {
  if (window.__coreReady) return;
  var d = document.createElement("div");
  d.setAttribute("style", "position:fixed;left:16px;right:16px;bottom:16px;z-index:200;background:#F7ECD6;color:#7a4e0c;border-radius:10px;padding:14px 16px;font:15px/1.5 system-ui,sans-serif;max-width:640px;margin:0 auto");
  d.innerHTML = "<b>Sayfa yüklenemedi.</b> Giriş sistemi (Google/Firebase) indirilemedi. Ctrl+Shift+R ile yenile. Reklam engelleyici varsa bu site için kapat.";
  document.body.appendChild(d);
}, 10000);
</script>
</head>
<body>
<div class="wrap">
  <div class="sitebar"><a href="../">← Ana sayfa</a><span id="ub"></span></div>

  <!-- MENU: choose what the back of a card / the matching tile shows, then a mode -->
  <section id="menu">
    <h1 id="mTitle">Woord<mark>kaarten</mark></h1>
    <p class="sub" id="mSub"></p>
    <div class="label">Wat staat er op de achterkant?</div>
    <div class="seg" id="sideSeg">
      <button data-side="def">Uitleg (NL)</button>
      <button data-side="tr">Türkçe</button>
    </div>
    <div class="label">Kies een spel</div>
    <div class="modes">
      <button class="mode" id="goCards"><h3>🃏 Kaartjes</h3><p>Draai de kaart om. Weet je het? Of nog oefenen? Moeilijke kaarten komen terug.</p><span class="best" id="bestCards"></span></button>
      <button class="mode" id="goMatch"><h3>🧩 Koppelen</h3><p>Zoek de paren: woord en betekenis. Zo snel mogelijk, met weinig fouten.</p><span class="best" id="bestMatch"></span></button>
      <a class="mode" id="goToets"><h3>✏️ Toets</h3><p>De gewone woordentest, alleen met deze woorden.</p></a>
    </div>
  </section>

  <!-- FLASHCARDS -->
  <section id="cards" hidden>
    <div class="bar">
      <button class="link" data-quit>← Stoppen</button>
      <span class="chip" id="cCount"></span>
      <span class="chip" id="cKnown"></span>
    </div>
    <div class="progress"><span id="cProg"></span></div>
    <div class="flip" id="flip" role="button" tabindex="0" aria-label="Kaart omdraaien">
      <div class="flip-in">
        <div class="face"><button class="say" id="say1" aria-label="Voorlezen">🔊</button><div class="front-word" id="cWord" lang="nl"></div><span class="tap">Tik om te draaien</span></div>
        <div class="face b"><button class="say" id="say2" aria-label="Voorlezen">🔊</button><div class="back-main" id="cMain"></div><div class="back-sub" id="cSub"></div><div class="ex" id="cEx"></div></div>
      </div>
    </div>
    <div class="judge">
      <button class="no" id="cNo">✗ Nog oefenen</button>
      <button class="ok" id="cOk">✓ Ken ik</button>
    </div>
  </section>

  <!-- MATCHING GAME -->
  <section id="match" hidden>
    <div class="bar">
      <button class="link" data-quit>← Stoppen</button>
      <span class="chip" id="mRound"></span>
      <span class="chip" id="mTime">⏱ 0:00</span>
      <span class="chip" id="mErr">0 fouten</span>
    </div>
    <div class="progress"><span id="mProg"></span></div>
    <div class="match"><div class="col" id="mLeft"></div><div class="col" id="mRight"></div></div>
  </section>

  <!-- RESULT (Turkish explanation for the parent, like the other kids pages) -->
  <section id="result" hidden>
    <h1 id="rTitle"></h1>
    <div class="summary" id="rStats"></div>
    <div id="rListBox"><div class="label">Bunlar henüz zor / Nog oefenen</div><div class="list" id="rList"></div></div>
    <div class="actions">
      <button class="btn" id="rAgain">Nog een keer</button>
      <button class="btn ghost" data-quit>Menu</button>
    </div>
  </section>
</div>

<script type="module">
import { gate, userBox, saveAttempt, loadAttempts, esc } from "../js/core.js";

// Which school list: ?lijst=weer -> the school words (bron "school") with thema "weer" from data/woorden.json
const LIJST = new URLSearchParams(location.search).get("lijst") || "weer";
const MODULE = "school-" + LIJST;        // same id as the card in data/catalog.json (titles in mail/admin)
const PAIRS = 6;                         // tiles per matching round
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const speak = t => { if (!("speechSynthesis" in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "nl-NL"; u.rate = .9; speechSynthesis.speak(u); };
const show = s => ["menu", "cards", "match", "result"].forEach(x => $(x).hidden = x !== s);

// Back side: Dutch definition (as on the school sheet) or Turkish meaning; remembered in this browser
let side = localStorage.getItem("woordkaarten:side") || "def";
const meaning = w => side === "tr" ? w.tr : (w.definitie || w.tr);
function drawSide() { document.querySelectorAll("#sideSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.side === side)); }
document.querySelectorAll("#sideSeg button").forEach(b => b.onclick = () => { side = b.dataset.side; localStorage.setItem("woordkaarten:side", side); drawSide(); });

let WORDS = [], ATTEMPTS = [], USER;

// ---------- Menu ----------
function renderMenu() {
  const lijst = WORDS[0]?.lijst || LIJST;
  $("mTitle").innerHTML = `Thema <mark>${esc(LIJST.charAt(0).toUpperCase() + LIJST.slice(1))}</mark>`;
  $("mSub").textContent = `${lijst} · ${WORDS.length} woorden`;
  $("goToets").href = `../woorden/?lijst=${encodeURIComponent(LIJST)}`;
  const cards = ATTEMPTS.filter(a => a.test === "kaarten"), match = ATTEMPTS.filter(a => a.test === "koppelen");
  $("bestCards").textContent = cards.length ? `Beste: ${Math.max(...cards.map(a => a.score))}/${cards[0].total} meteen goed` : "";
  const fastest = match.filter(a => a.score === a.total).map(a => a.duration_ms);
  $("bestMatch").textContent = fastest.length ? `Record zonder fouten: ${fmt(Math.min(...fastest))}` : match.length ? `${match.length}× gespeeld` : "";
  drawSide();
  show("menu");
}
document.querySelectorAll("[data-quit]").forEach(b => b.onclick = () => { clearInterval(M?.timer); renderMenu(); });

// ---------- Flashcards ----------
// Queue of words; "Nog oefenen" puts the word back a few places later, so it returns in the same round.
let C = null;
function startCards(list = WORDS) {
  C = { queue: shuffle(list), first: {}, tries: {}, known: 0, total: list.length, t0: Date.now(), words: list };
  show("cards"); drawCard();
}
function drawCard() {
  const w = C.queue[0];
  $("flip").classList.remove("back");
  $("cWord").textContent = w.nl;
  $("cMain").textContent = meaning(w);
  $("cSub").textContent = side === "tr" ? (w.definitie || "") : w.tr;   // the other meaning, small
  $("cEx").innerHTML = `<span lang="nl">${esc(w.voorbeeld)}</span>${w.voorbeeld_tr ? `<br><em>${esc(w.voorbeeld_tr)}</em>` : ""}`;
  $("cCount").textContent = `Nog ${C.queue.length}`;
  $("cKnown").textContent = `✓ ${C.known}/${C.total}`;
  $("cProg").style.width = (C.known / C.total * 100) + "%";
}
$("flip").onclick = e => { if (!e.target.closest(".say")) $("flip").classList.toggle("back"); };
$("flip").onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); $("flip").classList.toggle("back"); } };
$("say1").onclick = $("say2").onclick = () => speak(C.queue[0].nl);
function judge(ok) {
  const w = C.queue.shift();
  if (!(w.id in C.first)) C.first[w.id] = ok;               // first answer counts for the score
  C.tries[w.id] = (C.tries[w.id] || 0) + 1;
  if (ok) C.known++;
  else C.queue.splice(Math.min(3, C.queue.length), 0, w);   // comes back after 3 other cards
  if (!C.queue.length) finishCards(); else drawCard();
}
$("cOk").onclick = () => judge(true);
$("cNo").onclick = () => judge(false);
document.addEventListener("keydown", e => {
  if ($("cards").hidden) return;
  if (e.key === "ArrowRight") judge(true);
  if (e.key === "ArrowLeft") judge(false);
});
function finishCards() {
  const ms = Date.now() - C.t0;
  const right = C.words.filter(w => C.first[w.id]).length;
  const hard = C.words.filter(w => !C.first[w.id]);
  save({ test: "kaarten", title: "Kaartjes", ms, score: right, total: C.total,
    answers: C.words.map(w => ({ qid: w.id, w: w.id, chosen: C.first[w.id] ? "ken ik" : "nog oefenen", correct: !!C.first[w.id] })) });
  result(`Alle kaarten gedaan!${right === C.total ? " 🎉" : ""}`,
    [[`${right}/${C.total}`, "Meteen goed / İlk seferde bildi"], [fmt(ms), "Tijd / Süre"]], hard,
    () => startCards(C.words));
  // Extra button logic: practise only the hard ones
  $("rAgain").textContent = hard.length ? "Alleen de moeilijke" : "Nog een keer";
  if (hard.length) $("rAgain").onclick = () => startCards(hard);
}

// ---------- Matching ----------
// All words in rounds of 6: click a word, then its meaning (or the other way round).
let M = null;
function startMatch() {
  const order = shuffle(WORDS), rounds = [];
  for (let i = 0; i < order.length; i += PAIRS) rounds.push(order.slice(i, i + PAIRS));
  // A last round of 1-2 words is too easy: merge it into the round before
  if (rounds.length > 1 && rounds.at(-1).length < 3) rounds.at(-2).push(...rounds.pop());
  M = { rounds, r: 0, errors: 0, wrongIds: new Set(), done: 0, sel: null, t0: Date.now() };
  M.timer = setInterval(() => $("mTime").textContent = "⏱ " + fmt(Date.now() - M.t0), 500);
  show("match"); drawRound();
}
function tile(w, kind) {
  const b = document.createElement("button");
  b.className = "tile" + (kind === "w" ? " w" : "");
  b.textContent = kind === "w" ? w.nl : meaning(w);
  if (kind === "w") b.lang = "nl";
  b.dataset.id = w.id; b.dataset.kind = kind;
  b.onclick = () => pick(b);
  return b;
}
function drawRound() {
  const set = M.rounds[M.r];
  $("mLeft").replaceChildren(...shuffle(set).map(w => tile(w, "w")));
  $("mRight").replaceChildren(...shuffle(set).map(w => tile(w, "m")));
  $("mRound").textContent = `Ronde ${M.r + 1}/${M.rounds.length}`;
}
function pick(b) {
  if (b.classList.contains("ok")) return;
  if (!M.sel || M.sel.dataset.kind === b.dataset.kind) {     // first pick, or change pick in the same column
    M.sel?.classList.remove("sel");
    M.sel = b; b.classList.add("sel");
    if (b.dataset.kind === "w") speak(b.textContent);
    return;
  }
  const a = M.sel; M.sel = null; a.classList.remove("sel");
  if (a.dataset.id === b.dataset.id) {
    [a, b].forEach(x => { x.classList.add("ok"); x.disabled = true; });
    M.done++;
    $("mProg").style.width = (M.done / WORDS.length * 100) + "%";
    if (M.rounds[M.r].every(w => document.querySelector(`.tile.w[data-id="${w.id}"]`).classList.contains("ok"))) {
      M.r++;
      setTimeout(() => M.r < M.rounds.length ? drawRound() : finishMatch(), 400);
    }
  } else {
    M.errors++;
    // Both words of a wrong pair count as "still hard"
    [a, b].forEach(x => { M.wrongIds.add(x.dataset.id); x.classList.add("no"); setTimeout(() => x.classList.remove("no"), 450); });
    $("mErr").textContent = `${M.errors} fouten`;
  }
}
function finishMatch() {
  clearInterval(M.timer);
  const ms = Date.now() - M.t0;
  const hard = WORDS.filter(w => M.wrongIds.has(w.id));
  save({ test: "koppelen", title: "Koppelen", ms, score: WORDS.length - hard.length, total: WORDS.length,
    answers: WORDS.map(w => ({ qid: w.id, w: w.id, chosen: M.wrongIds.has(w.id) ? "fout" : "goed", correct: !M.wrongIds.has(w.id) })) });
  result(M.errors ? "Klaar!" : "Klaar zonder fouten! 🎉",
    [[fmt(ms), "Tijd / Süre"], [String(M.errors), "Fouten / Hata"]], hard, startMatch);
  $("rAgain").textContent = "Nog een keer";
}

// ---------- Result + saving ----------
function result(title, stats, hard, again) {
  $("rTitle").textContent = title;
  $("rStats").innerHTML = stats.map(([v, l]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("");
  $("rListBox").hidden = !hard.length;
  $("rList").innerHTML = hard.map(w => `<article class="rbox"><b lang="nl">${esc(w.nl)}</b>
    <p lang="nl">${esc(w.definitie || "")}</p><p><strong>Anlamı:</strong> ${esc(w.tr)}</p><p lang="nl"><em>${esc(w.voorbeeld)}</em></p></article>`).join("");
  $("rAgain").onclick = again;
  show("result");
}
function save({ test, title, ms, score, total, answers }) {
  const now = new Date();
  const attempt = { kind: "full", test, title, lijst: LIJST, side,
    started_at: new Date(now - ms).toISOString(), finished_at: now.toISOString(),
    duration_s: Math.round(ms / 1000), duration_ms: ms, score, total, answers };
  ATTEMPTS.unshift(attempt);
  saveAttempt(USER.uid, MODULE, attempt).catch(e =>
    $("rTitle").insertAdjacentHTML("afterend", `<p class="saveerr">Sonuç kaydedilemedi (${esc(e.code || "hata")}).</p>`));
}

$("goCards").onclick = () => startCards();
$("goMatch").onclick = () => startMatch();

// ---------- Start: login, then load the words of this list ----------
const { user, profile } = await gate({ area: "kids", title: "Woordkaarten", seen: MODULE });
USER = user;
$("ub").innerHTML = userBox(user, profile);
try {
  const data = await (await fetch("../data/woorden.json", { cache: "no-cache" })).json();
  WORDS = data.woorden.filter(w => w.bron === "school" && w.thema === LIJST);
} catch (e) { $("mSub").textContent = "Kelimeler yüklenemedi: " + e.message; throw e; }
if (!WORDS.length) { $("mSub").textContent = `Bu liste bulunamadı: ${LIJST}`; throw new Error("empty list"); }
ATTEMPTS = await loadAttempts(user.uid, MODULE).catch(() => []);
renderMenu();
</script>
</body>
</html>
