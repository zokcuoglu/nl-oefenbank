<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#C8551B">
<title>NL Oefenbank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/site.css">
<script>
// Watchdog: if the login module has not loaded after 10 s (network block, old cache), explain it on screen
setTimeout(function () {
  if (window.__coreReady) return;
  var d = document.createElement("div");
  d.setAttribute("style", "position:fixed;left:16px;right:16px;bottom:16px;z-index:200;background:#F7ECD6;color:#7a4e0c;border-radius:10px;padding:14px 16px;font:15px/1.5 system-ui,sans-serif;max-width:640px;margin:0 auto");
  d.innerHTML = "<b>Sayfa yüklenemedi.</b> Giriş sistemi (Google/Firebase) indirilemedi. Ctrl+Shift+R ile yenile. Reklam engelleyici varsa bu site için kapat. Devam ederse F12 → Console'daki kırmızı satırların ekran görüntüsünü Zana'ya gönder.";
  document.body.appendChild(d);
}, 10000);
</script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><small>Hollandaca çalışma</small><h1>NL Oefenbank</h1></div>
    <div class="navlinks" id="ub"></div>
    <!-- Three tabs: general Dutch, NT2 exam practice, daily games. The choice is kept in the address (#nt2, #oyunlar), so a reload or a shared link opens the same tab -->
    <nav class="tabs hometabs" role="tablist">
      <button class="tab" role="tab" data-tab="calisma" aria-selected="true">Hollandaca</button>
      <button class="tab" role="tab" data-tab="nt2" aria-selected="false">NT2 sınavı</button>
      <button class="tab" role="tab" data-tab="oyunlar" aria-selected="false">Günün oyunları</button>
    </nav>
  </div>
</header>
<div class="wrap">
  <main id="app"><p class="muted">Yükleniyor…</p></main>
  <main id="games" hidden>
    <section class="panel">
      <span class="eyebrow">Günün oyunları</span>
      <h2 style="margin-top:4px">Her gün yeni oyunlar</h2>
      <p class="muted" style="margin:6px 0 0;max-width:62ch">Herkes aynı oyunu oynar; sonunda istatistiklerini ve günlük, haftalık, aylık sıralamayı görürsün. Hollandaca Woordle Slimspel'dekiyle aynıdır.</p>
      <nav class="gamelang" role="tablist" style="margin-top:12px" id="gamenav"></nav>
    </section>
    <div id="gamebox"></div>
  </main>
</div>
<style>
/* site.css gives main display:flex, which beats the hidden attribute: make hidden win again */
[hidden]{display:none!important}
/* Home tabs sit under the brand row, full width */
.hometabs{flex-basis:100%;margin-top:-4px}
/* Language switch for the games */
.gamelang{display:flex;gap:6px;flex-wrap:wrap}
.gamelang button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500}
.gamelang button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pane{display:flex;flex-direction:column;gap:18px}
/* Home: quick links, "continue" row, foldable sections */
.jump{display:flex;gap:6px;flex-wrap:wrap}
.jump button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500}
.jump button:hover{border-color:var(--accent)}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px}
a.mini{display:flex;flex-direction:column;gap:4px;padding:12px 14px;color:inherit;text-decoration:none;font-size:14px}
a.mini:hover{border-color:var(--accent)}
details.sec{border-top:1px solid var(--line);padding-top:14px;scroll-margin-top:12px}
details.sec>summary{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;cursor:pointer;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--muted);font-size:18px;width:14px}
details.sec[open]>summary::before{content:"▾"}
details.sec>summary h2{margin:0}
.secbody{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.linklist{display:flex;gap:8px;flex-wrap:wrap}
.linklist a{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;color:inherit;text-decoration:none;font-size:14px}
.linklist a:hover{border-color:var(--accent)}
</style>

<script type="module">
// Home page: shows the exercise catalog filtered by account type.
// Adults see NT2 + kids; child accounts see only the kids area.
import { gate, userBox, esc, loadAllAttempts, ROOT, saveAttempt, loadAttempts, db } from "./js/core.js";
// New functions go in their own file, not in core.js (an older core.js may still be cached; see woordle-api.js)
import { saveWoordlePlay, loadWoordlePlays } from "./js/woordle-api.js";

const app = document.getElementById("app");
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString("tr-TR", { day: "2-digit", month: "short" }); } catch (e) { return ""; } };
const daysTo = d => d ? Math.max(0, Math.round((new Date(d + "T00:00:00") - new Date(new Date().toDateString())) / 86400000)) : null;

const { user, profile } = await gate({ area: "any" });
document.getElementById("ub").innerHTML = userBox(user, profile);

let cat;
try { cat = await (await fetch("data/catalog.json", { cache: "no-cache" })).json(); }
catch (e) { app.innerHTML = `<div class="notice">Liste yüklenemedi: ${esc(e.message)}</div>`; throw e; }

// Last activity per module, from this user's own attempts (one read for all)
const attempts = await loadAllAttempts(user.uid).catch(() => []);
const lastBy = {};
attempts.forEach(a => { if (!lastBy[a.module]) lastBy[a.module] = a; });

function card(m) {
  const last = lastBy[m.id];
  const days = m.exam ? daysTo(profile.exams?.[m.id] || (m.id === "lezen" ? profile.exam_date : null)) : null;
  const chips = [
    m.status === "soon" ? `<span class="chip">yakında</span>` : "",
    days !== null ? `<span class="chip accent num">sınava ${days} gün</span>` : "",
    last ? `<span class="chip num">son: ${fmtDate(last.finished_at)} · ${last.score}/${last.total}</span>` : (m.status === "ready" ? `<span class="chip">başlanmadı</span>` : "")
  ].join("");
  const inner = `<span class="eyebrow">${esc(m.group ? cat.groups[m.group] : m.area === "media" ? "Her gün" : m.area === "slimspel" ? "Slimspel" : m.area === "dersler" ? "Video ders" : "NT2")}</span><h3>${esc(m.title)}</h3><p>${esc(m.desc)}</p><div class="row">${chips}</div>`;
  return m.status === "ready"
    ? `<a class="panel card" href="${ROOT}${m.href}">${inner}</a>`
    : `<article class="panel card soon">${inner}</article>`;
}

function kidsSection() {
  let groups = Object.keys(cat.groups);
  // A child account sees only its own groep; without a groep it sees none and is told to ask the admin
  if (profile.type === "child") {
    groups = groups.filter(g => g === profile.groep);
    if (!groups.length) return `<div class="notice">Grubun henüz ayarlanmamış. Yöneticiden profiline grubunu eklemesini iste.</div>`;
  }
  // Adults: their own groep (if set) comes first
  else if (profile.groep && groups.includes(profile.groep)) groups.sort((a, b) => (b === profile.groep) - (a === profile.groep));
  return groups.map(g => {
    const ms = cat.modules.filter(m => m.area === "kids" && m.group === g);
    return `<section><div class="area-head"><h3>${esc(cat.groups[g])}${g === profile.groep ? ` <span class="chip accent">senin grubun</span>` : ""}</h3></div>
      <div class="cards" style="margin-top:12px">${ms.length ? ms.map(card).join("") : `<article class="panel card soon"><p>Henüz test yok. Okul dokümanları geldikçe eklenecek.</p></article>`}</div></section>`;
  }).join("");
}

const isChild = profile.type === "child";
// NT2 cards: only those for the exam level chosen on the profile (B1 default; "beide" = all)
const niveau = profile.examen_niveau || "B1";
const nt2 = cat.modules.filter(m => m.area === "nt2" && (!m.niveau || niveau === "beide" || m.niveau === niveau));
// Show the exam cards in a fixed skill order (reading, listening, writing, speaking, KNM) instead of the order they were built in
const NT2_ORDER = ["lezen", "luisteren", "schrijven", "spreken", "knm"];
const skillRank = m => { const i = NT2_ORDER.findIndex(s => m.id.startsWith(s)); return i < 0 ? 99 : i; };
nt2.sort((a, b) => skillRank(a) - skillRank(b));
const levelNote = `<span class="chip">${niveau === "beide" ? "A2 + B1" : niveau}</span> <a href="${ROOT}profile.html" style="font-size:13px">seviyeyi değiştir</a>`;

// ---------- Home layout: quick links, a "continue" row and foldable sections ----------
// Why: the page used to be one long list of 30 cards. Now each area is a section that can be folded,
// and the browser remembers which ones are open. Storage can be unavailable, so it is always in try/catch.
const SEC_KEY = "nloefenbank:sections";
let secState = {};
try { secState = JSON.parse(localStorage.getItem(SEC_KEY) || "{}") || {}; } catch {}
const SECTIONS = [];   // filled by section(); also used for the quick links at the top
function section(id, title, note, body, openByDefault) {
  SECTIONS.push({ id, title });
  const open = id in secState ? secState[id] : openByDefault;
  return `<details class="sec" id="sec-${id}" data-sec="${id}"${open ? " open" : ""}>
    <summary><h2>${esc(title)}</h2><span class="muted">${note}</span></summary>
    <div class="secbody">${body}</div></details>`;
}

// "Devam et": the three exercises this person used most recently (attempts arrive newest first)
const byId = Object.fromEntries(cat.modules.map(m => [m.id, m]));
const recent = [];
for (const a of attempts) {
  const m = byId[a.module];
  const allowed = m && m.status === "ready" && !m.href.startsWith("#") && !(isChild && ["nt2", "media", "dersler"].includes(m.area));
  if (allowed && !recent.includes(m)) recent.push(m);
  if (recent.length === 3) break;
}
const recentRow = recent.length ? `<section><span class="eyebrow">Devam et</span>
  <div class="minis">${recent.map(m => { const l = lastBy[m.id]; return `<a class="panel mini" href="${ROOT}${m.href}"><b>${esc(m.title)}</b><span class="muted num">son: ${fmtDate(l.finished_at)} · ${l.score}/${l.total}</span></a>`; }).join("")}</div></section>` : "";

const slim = cat.modules.filter(m => m.area === "slimspel" && m.home !== false);
// Adults get the games as a short list of links; children keep the big cards
const slimBody = isChild
  ? `<section class="cards">${slim.map(card).join("")}</section>`
  : `<div class="linklist">${slim.map(m => `<a href="${ROOT}${m.href}">${esc(m.title)}</a>`).join("")}<a href="${ROOT}../slimspel/">Tüm oyunlar →</a></div>`;

// Two panes inside this page, one per tab: general Dutch ("calisma") and NT2 exam practice ("nt2").
// Why: learning Dutch for daily life and preparing for the exam are different goals; mixed together the page looked exam-only.
const generalHtml = [
  isChild ? "" : section("dersler", cat.areas.dersler.title, esc(cat.areas.dersler.desc), `<section class="cards">${cat.modules.filter(m => m.area === "dersler").map(card).join("")}</section>`, true),
  isChild ? "" : section("media", cat.areas.media.title, esc(cat.areas.media.desc), `<section class="cards">${cat.modules.filter(m => m.area === "media").map(card).join("")}</section>`, true),
  section("kids", cat.areas.kids.title, esc(cat.areas.kids.desc), kidsSection(), isChild),
  section("slimspel", cat.areas.slimspel.title, `${slim.length} oyun · ${esc(cat.areas.slimspel.desc)}`, slimBody, isChild)
].join("");
const nt2Html = isChild ? "" : `<div class="pane" data-pane="nt2" hidden>
  <div class="area-head"><h2>${esc(cat.areas.nt2.title)}</h2><span class="muted">${esc(cat.areas.nt2.desc)} ${levelNote}</span></div>
  <section class="cards">${nt2.map(card).join("")}</section></div>`;

app.innerHTML = `
  <section class="panel"><span class="eyebrow">Hoş geldin</span><h2 style="margin-top:4px">${esc(profile.name || user.displayName || "")}</h2>
    <p class="muted" style="margin:6px 0 0;max-width:62ch">${isChild ? "Okul alıştırmaların aşağıda. Bir teste tıkla ve başla." : "Genel Hollandaca çalışması “Hollandaca” sekmesinde, sınav hazırlığı “NT2 sınavı” sekmesinde."}</p></section>
  ${recentRow}
  <div class="pane" data-pane="calisma">
    <nav class="jump">${SECTIONS.map(s => `<button data-jump="${s.id}">${esc(s.title)}</button>`).join("")}</nav>
    ${generalHtml}</div>
  ${nt2Html}`;

// Remember open/closed per section; a quick link opens its section and scrolls to it
app.querySelectorAll("details.sec").forEach(d => d.addEventListener("toggle", () => {
  secState[d.dataset.sec] = d.open;
  try { localStorage.setItem(SEC_KEY, JSON.stringify(secState)); } catch {}
}));
app.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => {
  const d = document.getElementById("sec-" + b.dataset.jump);
  d.open = true;
  d.scrollIntoView({ behavior: "smooth", block: "start" });
});

// ---------- Tabs: "Çalışma" (the cards above) and "Günün oyunları" (daily games, in this page) ----------
// Each game is a module with a mount function; it gets this site's own save/load functions.
// Woordle is shared with Slimspel (slimspel/woordle/game.js): same words, statistics and rankings.
// WDL_V: raise it after each change to game.js, so browsers fetch the new file instead of an old copy.
const WDL_V = "2026-11-05";
// The other games live in oyunlar/. Each game is loaded the first time it is opened.
const api = { saveAttempt, loadAttempts, saveWoordlePlay, loadWoordlePlays };
// Link that opens one game directly (used in the "Paylaş" text): ...nl-oefenbank/#oyunlar/<id>
const gameUrl = id => location.origin + location.pathname + "#oyunlar/" + id;
const GAMES = [
  { id: "woordle-tr", title: "Woordle · Türkçe", load: async box => (await import(`${ROOT}../slimspel/woordle/game.js?v=${WDL_V}`)).mountWoordle(box, { lang: "tr", user, profile, api, shareUrl: gameUrl("woordle-tr") }) },
  { id: "woordle-nl", title: "Woordle · Hollandaca", load: async box => (await import(`${ROOT}../slimspel/woordle/game.js?v=${WDL_V}`)).mountWoordle(box, { lang: "nl", user, profile, api, shareUrl: gameUrl("woordle-nl") }) },
  { id: "dehet", title: "de / het", load: async box => (await import("./oyunlar/dehet.js?v=2")).mountDeHet(box, { user, profile, api, shareUrl: gameUrl("dehet") }) },
  { id: "werkwoorden", title: "Düzensiz fiiller", load: async box => (await import("./oyunlar/werkwoorden.js?v=3")).mountWerkwoorden(box, { user, profile, api, shareUrl: gameUrl("werkwoorden") }) },
  { id: "kruiswoord", title: "NT2 Bulmaca", load: async box => (await import("./oyunlar/kruiswoord.js?v=4")).mountKruiswoord(box, { user, profile, api, shareUrl: gameUrl("kruiswoord") }) },
  { id: "verbanden", title: "Bağlantılar", load: async box => (await import("./oyunlar/verbanden.js?v=3")).mountVerbanden(box, { user, profile, api, shareUrl: gameUrl("verbanden") }) },
  // Fixed prepositions (denken aan …) and er + preposition (erop, eraan …): one module, two games
  { id: "voorzetsels", title: "Edatlar", load: async box => (await import("./oyunlar/voorzetsels.js?v=2")).mountVoorzetsels(box, { game: "voorzetsels", user, profile, api, shareUrl: gameUrl("voorzetsels") }) },
  { id: "erop", title: "er + edat", load: async box => (await import("./oyunlar/voorzetsels.js?v=2")).mountVoorzetsels(box, { game: "erop", user, profile, api, shareUrl: gameUrl("erop") }) },
];
document.getElementById("gamenav").innerHTML = GAMES.map(g => `<button role="tab" data-game="${g.id}" aria-selected="false">${g.title}</button>`).join("");
document.getElementById("gamebox").innerHTML = GAMES.map(g => `<div id="game-${g.id}" hidden></div>`).join("");
const mounted = {};
async function showGame(id) {
  if (!GAMES.some(g => g.id === id)) id = GAMES[0].id;
  document.querySelectorAll("#gamenav button").forEach(b => { const on = b.dataset.game === id; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
  GAMES.forEach(g => document.getElementById("game-" + g.id).hidden = g.id !== id);
  try { localStorage.setItem("nloefenbank:game", id); } catch {}
  history.replaceState(null, "", "#oyunlar/" + id);   // the address bar then links straight to this game
  if (mounted[id]) return;
  mounted[id] = true;
  const box = document.getElementById("game-" + id);
  box.innerHTML = `<p class="muted">Yükleniyor…</p>`;
  try { await GAMES.find(g => g.id === id).load(box); }
  catch (e) { mounted[id] = false; box.innerHTML = `<div class="notice">Oyun yüklenemedi: ${esc(e.message)}</div>`; }
}
// "#oyunlar" = games tab; "#oyunlar/<id>" = games tab with that game open (links in shared results)
const noGames = profile.type === "child";
if (noGames) document.querySelector(".hometabs").hidden = true;
// Without a hash the page opens on the tab used last time (Hollandaca or NT2 sınavı)
const TAB_KEY = "nloefenbank:tab";
const hashTab = () => {
  if (noGames) return "calisma";
  if (location.hash.startsWith("#oyunlar")) return "oyunlar";
  if (location.hash === "#nt2") return "nt2";
  let t = ""; try { t = localStorage.getItem(TAB_KEY) || ""; } catch {}
  return t === "nt2" ? "nt2" : "calisma";
};
const hashGame = () => location.hash.startsWith("#oyunlar/") ? decodeURIComponent(location.hash.slice(9)) : "";
function showTab(tab) {
  document.querySelectorAll(".hometabs .tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  app.hidden = tab === "oyunlar";
  app.querySelectorAll("[data-pane]").forEach(p => p.hidden = p.dataset.pane !== tab);
  if (tab !== "oyunlar") try { localStorage.setItem(TAB_KEY, tab); } catch {}
  document.getElementById("games").hidden = tab !== "oyunlar";
  if (tab === "oyunlar") { let g = hashGame(); if (!g) try { g = localStorage.getItem("nloefenbank:game") || ""; } catch {} showGame(g); }
  window.__playtime?.draw();   // play-time clock only shows on the games tab
}
document.querySelectorAll(".hometabs .tab").forEach(b => b.onclick = () => { history.replaceState(null, "", b.dataset.tab === "oyunlar" ? "#oyunlar" : b.dataset.tab === "nt2" ? "#nt2" : location.pathname); showTab(b.dataset.tab); });
document.querySelectorAll("#gamenav button").forEach(b => b.onclick = () => showGame(b.dataset.game));
addEventListener("hashchange", () => showTab(hashTab()));
showTab(hashTab());

// Children: the games tab counts toward the 15 minutes a day of play time and has set hours (shared with Slimspel).
// Studying in the "Çalışma" tab is never limited. Loaded on its own so a problem there never stops the page.
if (profile.type === "child" && !profile._view) import(`${ROOT}../slimspel/js/speeltijd.js?v=1`).then(m => m.startPlaytime({
  db, user, profile, lang: "tr",
  isOn: () => !document.getElementById("games").hidden,
  onLeave: () => { history.replaceState(null, "", location.pathname); showTab("calisma"); }
})).catch(() => {});
</script>
</body>
</html>
