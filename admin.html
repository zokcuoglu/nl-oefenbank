<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#C8551B">
<title>Yönetim · NL Oefenbank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/site.css">
<style>
/* Tabs on top, folded sections, one bar per exercise */
.admintabs{margin-bottom:16px;width:100%;display:flex} .admintabs button{flex:1;font-size:15px;padding:10px 14px;display:inline-flex;gap:6px;justify-content:center;align-items:center}
details.fold summary{cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary h3{margin:0} details.fold summary h3::before{content:"▸ ";color:var(--muted)} details.fold[open] summary h3::before{content:"▾ "}
.modrow{grid-template-columns:minmax(8em,14em) 1fr auto}
@media (max-width:560px){.modrow{grid-template-columns:1fr;gap:4px} .minibar{display:none}}
</style>
<script>
// Watchdog: if the login module has not loaded after 10 s (network block, old cache), explain it on screen
setTimeout(function () {
  if (window.__coreReady) return;
  var d = document.createElement("div");
  d.setAttribute("style", "position:fixed;left:16px;right:16px;bottom:16px;z-index:200;background:#F7ECD6;color:#7a4e0c;border-radius:10px;padding:14px 16px;font:15px/1.5 system-ui,sans-serif;max-width:640px;margin:0 auto");
  d.innerHTML = "<b>Sayfa yüklenemedi.</b> Giriş sistemi (Google/Firebase) indirilemedi. Ctrl+Shift+R ile yenile. Reklam engelleyici varsa bu site için kapat. Devam ederse F12 → Console'daki kırmızı satırların ekran görüntüsünü Zana'ya gönder.";
  document.body.appendChild(d);
}, 10000);
</script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><small><a href="./">← Ana sayfa</a></small><h1>Yönetim</h1></div>
    <div class="navlinks" id="ub"></div>
  </div>
</header>
<div class="wrap"><main id="app"><p class="muted">Yükleniyor…</p></main></div>

<script type="module">
// Admin screen: accounts (status, type, role, parent), statistics, mail schedule and announcements.
// The page is hidden from non-admins, and firestore.rules also refuse their reads and writes.
import { gate, userBox, esc, db, TYPES, ROLES, STATUSES, roleOf, statusOf, loadAllAttempts } from "./js/core.js";
import { summarize, pct, recentRounds, dayBars, scoreChips } from "./js/stats.js";
import { collection, getDocs, getDoc, setDoc, doc, updateDoc, addDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const app = document.getElementById("app");
const { user, profile } = await gate({ area: "admin" });
document.getElementById("ub").innerHTML = userBox(user, profile);

const fmtDate = iso => { try { return iso ? new Date(iso).toLocaleDateString("tr-TR", { day: "2-digit", month: "short" }) : "-"; } catch (e) { return "-"; } };
const ROLE_HELP = {
  member: "Kendi çalışmasını ve profilini görür.",
  teacher: "Üye haklarına ek olarak sınıf açar ve sınıfındakilerin özetini görür (sınıf özelliği yakında).",
  admin: "Her şeyi görür, bu ekrandan tip ve rol atar."
};
let users = [], news = [], newsErr = "";
// The page has three tabs; the choice is kept in the URL hash (#istatistik) so a reload stays on the same tab
const TABS = { hesaplar: "Hesaplar", istatistik: "İstatistik", eposta: "E-posta" };
let tab = TABS[location.hash.slice(1)] ? location.hash.slice(1) : "hesaplar";
// Statistics filter: everyone, adults or children (their exercises and scores are very different)
const WHO = { all: "Herkes", adult: "Yetişkinler", child: "Öğrenciler" };
let who = "all";
// Mail schedule (Firestore settings/mail, read by scripts/mailer.py). weekday: 1 = Monday ... 7 = Sunday
const DEFAULT_SCHED = { news: { enabled: true, weekday: 1, hour: 8 }, weekly: { enabled: true, weekday: 7, hour: 18 } };
const WEEKDAYS = { 1: "Pazartesi", 2: "Salı", 3: "Çarşamba", 4: "Perşembe", 5: "Cuma", 6: "Cumartesi", 7: "Pazar" };
let sched = structuredClone(DEFAULT_SCHED), schedErr = "", lastNews = null, sentNews = [], weeklyLog = [], logErr = "";
// Statistics: attempts of every account, the catalog, and the news items
let stats = {}, rawAtt = {}, statsErr = "", cat = { modules: [] }, nieuws = { items: [], toetsen: [] }, teksten = { teksten: [] }, woorden = { woorden: [] };

async function load() {
  try {
    const snap = await getDocs(collection(db, "users"));
    // Pending accounts first, then most recently active
    const rank = u => statusOf(u) === "pending" ? 0 : 1;
    users = snap.docs.map(d => ({ uid: d.id, ...d.data() })).sort((a, b) => rank(a) - rank(b) || (b.last_active || "").localeCompare(a.last_active || ""));
  } catch (e) { app.innerHTML = `<div class="notice">Kullanıcılar okunamadı: <b>${esc(e.code || e.message)}</b>. Firebase'deki güvenlik kuralları güncel olmayabilir: repo'daki firestore.rules dosyasını yapıştırıp Publish'e bas.</div>`; return; }
  // Last announcements (sent by the mailer job, see scripts/mailer.py); a failure here only hides the list
  try {
    const ns = await getDocs(query(collection(db, "announcements"), orderBy("created_at", "desc"), limit(10)));
    news = ns.docs.map(d => ({ id: d.id, ...d.data() })); newsErr = "";
  } catch (e) { news = []; newsErr = e.code || e.message; }
  try {
    const snap = await getDoc(doc(db, "settings", "mail"));
    const saved = snap.exists() ? snap.data() : {};
    sched = { news: { ...DEFAULT_SCHED.news, ...(saved.news || {}) }, weekly: { ...DEFAULT_SCHED.weekly, ...(saved.weekly || {}) } }; schedErr = "";
    const ls = await getDocs(query(collection(db, "nieuws_sent"), orderBy("date", "desc"), limit(30)));
    sentNews = ls.docs.map(d => d.data()); lastNews = sentNews[0] || null;
  } catch (e) { schedErr = e.code || e.message; }
  try {
    [cat, nieuws, teksten, woorden] = await Promise.all(["catalog", "nieuws", "lezen-teksten", "woorden"].map(f => fetch(`data/${f}.json`, { cache: "no-cache" }).then(r => r.json())));
    // One read of each account's attempts (fine for a small group)
    const all = await Promise.all(users.map(u => loadAllAttempts(u.uid)));
    stats = Object.fromEntries(users.map((u, i) => [u.uid, summarize(all[i])])); rawAtt = Object.fromEntries(users.map((u, i) => [u.uid, all[i]])); statsErr = "";
  } catch (e) { statsErr = e.code || e.message; }
  // Weekly summary log (written by the mailer job); a failure here only hides those rows
  try { weeklyLog = (await getDocs(collection(db, "mail_log"))).docs.map(d => d.data()); logErr = ""; } catch (e) { weeklyLog = []; logErr = e.code || e.message; }
  render();
}

// ---------- sent mails: news, weekly summaries and announcements, newest first ----------
function sentHtml() {
  const itemOf = id => nieuws.items.find(i => i.id === id);
  const active = users.filter(u => statusOf(u) === "approved");
  const rows = [
    ...sentNews.map(n => { const it = itemOf(n.item_id);
      return { date: n.date, kind: "Haber", what: it ? `#${it.nr} ${it.titel}` : (n.titel || n.item_id), to: n.recipients || 0,
        // After the mail: how many people opened the item and did its quiz
        effect: `${active.filter(u => u.seen?.["nieuws:" + n.item_id]).length} açtı · ${active.filter(u => stats[u.uid]?.byTest["nieuws/" + n.item_id]).length} quiz çözdü` }; }),
    ...weeklyLog.filter(w => w.job === "weekly").map(w => ({ date: w.date, kind: "Haftalık özet", what: "Herkese kendi özeti", to: w.mails || 0, effect: "" })),
    ...news.filter(n => n.sent_at).map(n => ({ date: (n.sent_at || "").slice(0, 10), kind: "Duyuru", what: n.subject, to: n.recipients || 0, effect: "" })),
  ].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return `<section class="panel"><div class="sectionhead"><h3>Gönderilen e-postalar</h3><span class="muted">yeniden eskiye</span></div>
    ${logErr ? `<div class="notice" style="margin-bottom:10px">Haftalık özet kaydı okunamadı (${esc(logErr)}). Güvenlik kurallarını güncelle.</div>` : ""}
    ${rows.length ? `<div class="tablewrap"><table><thead><tr><th>Tarih</th><th>Tür</th><th>İçerik</th><th class="r">Kişi</th><th>Sonra</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td class="num muted">${esc(r.date)}</td><td>${esc(r.kind)}</td><td lang="nl">${esc(r.what)}</td><td class="r num">${r.to}</td><td class="muted" style="font-size:13px">${esc(r.effect)}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="muted">Henüz e-posta gönderilmedi. İlk haber, zamanlamaya göre gidecek.</p>`}
    <p class="muted" style="font-size:13px;margin:10px 0 0">Test e-postaları (GitHub Actions → Mailer → mode: test) burada görünmez; hiçbir yere kaydedilmez.</p></section>`;
}

// ---------- statistics ----------
// Readable label for one answered question (qid as saved by each exercise)
const WOORD_TYPES = { nl2tr: "Anlamı", tr2nl: "Hollandacası", gap: "Boşluk", def: "Tanım" };
const LEZEN_TYPES = { nltr: "Anlamı", trnl: "Hollandacası", invul: "Boşluk", lid: "de/het", kalip: "Kalıp" };
function questionLabel(module, qid) {
  if (module === "nieuws") {
    const [src, id] = qid.split(":"), it = nieuws.items.find(i => i.id === src), t = (nieuws.toetsen || []).find(x => x.id === src);
    const q = (it?.toets || t?.extra || []).find(x => x.id === id);
    return q ? `${it ? "#" + it.nr : t.titel} · ${q.vraag.replace(/<[^>]+>/g, "")}` : qid;
  }
  if (module === "lezen-teksten") {
    const [tid, id] = qid.split(":"), t = teksten.teksten.find(x => x.id === tid), q = t?.vragen.find(x => x.id === id);
    return q ? `${t.titel} · ${q.vraag}` : qid;
  }
  if (module === "woorden") { const [wid, type] = qid.split(":"), w = woorden.woorden.find(x => x.id === wid);
    return w ? `${WOORD_TYPES[type] || type}: ${w.nl} (${w.niveau})` : qid; }
  if (module === "lezen") { const [type, ...rest] = qid.split(":"); return `${LEZEN_TYPES[type] || type}: ${rest.join(":")}`; }
  return qid;
}
// Category of a news question (begrip, woorden, ...) by qid
function newsCat(qid) {
  const [src, id] = qid.split(":"), it = nieuws.items.find(i => i.id === src), t = (nieuws.toetsen || []).find(x => x.id === src);
  return (it?.toets || t?.extra || []).find(x => x.id === id)?.cat;
}
const CATNAME = { begrip: "Anlama", woorden: "Kelime", uitdrukkingen: "Deyim", grammatica: "Gramer" };

function statsHtml() {
  if (statsErr) return `<section class="panel"><span class="eyebrow">İstatistik</span><div class="notice" style="margin-top:8px">Çalışma kayıtları okunamadı (${esc(statsErr)}). Güvenlik kurallarını güncelle (admin'in attempts okuma izni).</div></section>`;
  const active = users.filter(u => statusOf(u) === "approved" && (who === "all" || (who === "child" ? u.type === "child" : u.type !== "child")));
  const daysSince = iso => iso ? Math.floor((Date.now() - new Date(iso)) / 864e5) : Infinity;
  const tone = p => p >= 80 ? "ok" : p >= 60 ? "warn" : "bad";
  const titleOf = id => cat.modules.find(m => m.id === id)?.title || id;
  const everyone = summarize(active.flatMap(u => rawAtt[u.uid] || []));
  // Last 7 days, everyone together
  const weekAgo = new Date(Date.now() - 7 * 864e5).toISOString();
  const week = active.flatMap(u => (rawAtt[u.uid] || []).filter(x => (x.finished_at || "") >= weekAgo));
  const weekOk = week.reduce((n, x) => n + (x.score || 0), 0), weekTot = week.reduce((n, x) => n + (x.total || 0), 0);
  const activeWeek = active.filter(u => recentRounds(stats[u.uid] || summarize([]), 7) > 0).length;
  const quiet = active.filter(u => daysSince(stats[u.uid]?.last) > 14);

  // Per person: busiest this week first; a click opens the details row
  const people = active.map(u => ({ u, s: stats[u.uid] || summarize([]) })).sort((a, b) => recentRounds(b.s, 7) - recentRounds(a.s, 7) || b.s.rounds - a.s.rounds);
  const detail = (u, s) => {
    const att = rawAtt[u.uid] || [], newsAtt = att.filter(x => x.module === "nieuws");
    // News quiz answers per category: where is this person weak?
    const byCat = {};
    newsAtt.forEach(x => (x.answers || []).forEach(an => { const c = newsCat(an.qid); if (!c) return; const v = byCat[c] = byCat[c] || { ok: 0, n: 0 }; v.n++; if (an.correct) v.ok++; }));
    const exams = Object.entries(u.exams || {}).filter(([, d]) => d).map(([m, d]) => `${esc(titleOf(m))}: ${esc(d)} (${Math.ceil((new Date(d) - Date.now()) / 864e5)} gün)`);
    const doneNews = [...nieuws.items.map(i => [i.id, `#${i.nr}`]), ...(nieuws.toetsen || []).map(t => [t.id, t.titel.split(" · ")[0]])].filter(([id]) => newsAtt.some(x => x.test === id));
    return `<div class="persondetail">
      <div><span class="eyebrow">Son 14 gün</span>${dayBars(s, 14)}</div>
      <div><span class="eyebrow">Alıştırmalar</span>${Object.keys(s.byModule).length ? `<table><tbody>${Object.entries(s.byModule).sort((a, b) => b[1].rounds - a[1].rounds).map(([id, m]) => `<tr><td>${esc(titleOf(id))}</td><td class="r num">${m.rounds} tur</td><td class="r num">%${pct(m.ok, m.tot)}</td><td class="r num muted">${fmtDate(m.last)}</td></tr>`).join("")}</tbody></table>` : `<p class="muted">Henüz tur yok.</p>`}</div>
      ${Object.keys(byCat).length ? `<div><span class="eyebrow">Haber quiz'leri: alanlara göre</span><div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${Object.entries(byCat).map(([c, v]) => { const p = pct(v.ok, v.n); return `<div class="catrow"><span>${CATNAME[c]}</span><div class="bar"><i style="width:${p}%;background:var(--${tone(p)})"></i></div><span class="num r">%${p} <span class="muted">(${v.n})</span></span></div>`; }).join("")}</div></div>` : ""}
      ${doneNews.length ? `<div><span class="eyebrow">Haberler (seviyeye göre en iyi, zamanla düşer)</span>${doneNews.map(([id, label]) => `<div class="row" style="justify-content:space-between;margin-top:6px"><span lang="nl">${esc(label)}</span>${scoreChips(newsAtt, id)}</div>`).join("")}</div>` : ""}
      ${exams.length ? `<div><span class="eyebrow">Sınav tarihleri</span><p style="margin:6px 0 0">${exams.join("<br>")}</p></div>` : ""}
    </div>`;
  };

  // Per exercise: rounds, people who solved it, people who opened it (users.seen)
  const ready = cat.modules.filter(m => m.status === "ready" && !m.id.startsWith("woorden-")
    && (who === "all" || m.id === "woorden" || (who === "child" ? ["kids", "slimspel"].includes(m.area) : m.area !== "kids")));
  const modRows = ready.map(m => {
    const solvers = active.filter(u => stats[u.uid]?.byModule[m.id]);
    return { m, rounds: solvers.reduce((n, u) => n + stats[u.uid].byModule[m.id].rounds, 0), solvers: solvers.length, openers: active.filter(u => u.seen?.[m.id]).length };
  }).sort((a, b) => b.rounds - a.rounds);
  // Per news item and mixed test
  const newsKeys = [...nieuws.items.map(i => ({ id: i.id, title: `#${i.nr} ${i.titel}` })), ...(nieuws.toetsen || []).map(t => ({ id: t.id, title: t.titel }))];
  const newsRows = newsKeys.map(k => {
    const tries = active.map(u => stats[u.uid]?.byTest["nieuws/" + k.id]).filter(Boolean);
    return { ...k, openers: active.filter(u => u.seen?.["nieuws:" + k.id]).length, solvers: tries.length, rounds: tries.reduce((n, t) => n + t.rounds, 0),
      best: tries.length ? Math.round(100 * tries.reduce((n, t) => n + t.best, 0) / tries.length) : null };
  });
  const status = r => r.rounds ? "" : r.openers ? `<span class="chip warn">açıldı, çözülmedi</span>` : `<span class="chip bad">hiç açılmadı</span>`;

  // Hardest questions: wrong share over everyone's answers (at least 2 answers)
  const q = {};
  active.forEach(u => (rawAtt[u.uid] || []).forEach(x => (x.answers || []).forEach(an => {
    const k = (x.module || "lezen") + "|" + an.qid, v = q[k] = q[k] || { module: x.module || "lezen", qid: an.qid, n: 0, wrong: 0, people: new Set() };
    v.n++; if (!an.correct) v.wrong++; v.people.add(u.uid);
  })));
  const maxRounds = Math.max(1, ...modRows.map(r => r.rounds));
  const hard = Object.values(q).filter(v => v.n >= 2 && v.wrong > 0).sort((a, b) => b.wrong / b.n - a.wrong / a.n || b.wrong - a.wrong).slice(0, 12);

  const whoSeg = `<div class="seg" role="group" aria-label="Kimin istatistiği">${Object.entries(WHO).map(([k, v]) =>
    `<button class="${who === k ? "on" : ""}" data-who="${k}" aria-pressed="${who === k}">${v}</button>`).join("")}</div>`;
  if (!active.length) return `<div class="row" style="margin-bottom:12px">${whoSeg}</div><section class="panel"><p class="muted" style="margin:0">Bu grupta onaylı hesap yok.</p></section>`;
  return `
    <div class="row" style="margin-bottom:12px">${whoSeg}<span class="muted" style="font-size:13px">${active.length} onaylı hesap</span></div>
    <section class="kpis">
      <div class="panel kpi"><div class="eyebrow">Bu hafta aktif</div><div class="v num">${activeWeek}<small class="muted" style="font-size:15px"> / ${active.length}</small></div></div>
      <div class="panel kpi"><div class="eyebrow">Bu hafta tur</div><div class="v num">${week.length}</div></div>
      <div class="panel kpi"><div class="eyebrow">Bu hafta doğruluk</div><div class="v num" style="color:var(--${weekTot ? tone(pct(weekOk, weekTot)) : "ink"})">${weekTot ? "%" + pct(weekOk, weekTot) : "-"}</div></div>
      <div class="panel kpi"><div class="eyebrow">14+ gündür sessiz</div><div class="v num" style="color:var(--${quiet.length ? "warn" : "ink"})">${quiet.length}</div></div>
    </section>
    <section class="panel"><div class="sectionhead"><h3>Kişiler</h3><span class="muted">bu hafta en aktif üstte · ayrıntı için isme tıkla</span></div>
      <div class="tablewrap"><table><thead><tr><th>Kişi</th><th>Son tur</th><th class="r">Bu hafta</th><th>Doğruluk</th></tr></thead><tbody>
      ${people.map(({ u, s }) => { const p = pct(s.ok, s.tot), idle = daysSince(s.last);
        return `<tr><td><button class="linkbtn" data-person="${esc(u.uid)}" aria-expanded="false">▸ <b>${esc(u.name || u.email || u.uid)}</b></button>${u.type === "child" && who === "all" ? ` <span class="chip">öğrenci</span>` : ""}</td>
          <td class="num">${s.last ? `<span class="${idle > 14 ? "chip warn" : "muted"}">${idle === 0 ? "bugün" : idle === 1 ? "dün" : idle + " gün önce"}</span>` : `<span class="chip bad">hiç</span>`}</td>
          <td class="r num"><b>${recentRounds(s, 7)}</b> <span class="muted">tur</span></td>
          <td>${s.tot ? `<span class="bar minibar"><i style="width:${p}%;background:var(--${tone(p)})"></i></span><span class="num">%${p}</span>` : `<span class="muted">-</span>`}</td></tr>
          <tr id="pd-${esc(u.uid)}" hidden><td colspan="4">${detail(u, s)}</td></tr>`; }).join("")}
      </tbody></table></div></section>
    <section class="panel"><div class="sectionhead"><h3>Son 30 gün</h3><span class="muted">günlük tur sayısı</span></div>${dayBars(everyone, 30)}</section>
    <section class="panel"><div class="sectionhead"><h3>Alıştırmalar</h3><span class="muted">en çok çözülen üstte</span></div>
      <div style="display:flex;flex-direction:column;gap:8px">${modRows.filter(r => r.rounds).map(r => `<div class="catrow modrow"><span>${esc(r.m.title)}</span>
        <div class="bar"><i style="width:${Math.round(100 * r.rounds / maxRounds)}%;background:var(--accent)"></i></div>
        <span class="num r">${r.rounds} tur · ${r.solvers} kişi</span></div>`).join("") || `<p class="muted" style="margin:0">Henüz tur yok.</p>`}</div>
      ${modRows.some(r => !r.rounds) ? `<p class="muted" style="font-size:13px;margin:12px 0 0"><b>Kimsenin çözmediği:</b> ${modRows.filter(r => !r.rounds).map(r => esc(r.m.title) + (r.openers ? " (açıldı)" : "")).join(", ")}</p>` : ""}</section>
    <details class="panel fold"><summary><h3>En çok yanlış yapılan sorular</h3><span class="muted">${hard.length} soru</span></summary>
      ${hard.length ? `<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Soru</th><th>Alıştırma</th><th class="r">Yanlış</th></tr></thead><tbody>
        ${hard.map(v => `<tr><td lang="nl">${esc(questionLabel(v.module, v.qid))}</td><td class="muted">${esc(titleOf(v.module))}</td><td class="r num"><span class="chip ${tone(100 - pct(v.wrong, v.n))}">${v.wrong}/${v.n}</span></td></tr>`).join("")}
        </tbody></table></div>` : `<p class="muted">Henüz yeterli cevap yok (bir soru en az 2 kez cevaplanmalı).</p>`}</details>
    ${who === "child" ? "" : `<details class="panel fold"><summary><h3 lang="nl">Nieuws in niveaus</h3><span class="muted">haber başına açan, quiz yapan, ortalama</span></summary>
      <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Haber / sınav</th><th class="r">Açan</th><th class="r">Quiz yapan</th><th class="r">Ort. en iyi</th></tr></thead><tbody>
      ${newsRows.map(r => `<tr><td lang="nl">${esc(r.title)}</td><td class="r num">${r.openers}</td><td class="r num">${r.solvers}</td>
        <td class="r num">${r.best === null ? status(r) : `<span class="chip ${tone(r.best)}">%${r.best}</span>`}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">"Açan" sayısı 16 Ekim'den itibaren tutuluyor.</p></details>`}`;
}

// ---------- mail schedule ----------
function schedRow(job, label) {
  const c = sched[job];
  return `<tr><td><b>${label}</b></td>
    <td><label class="switch" style="color:var(--ink)"><input type="checkbox" id="sc-${job}-on" ${c.enabled ? "checked" : ""}> açık</label></td>
    <td><select class="input" id="sc-${job}-day">${Object.entries(WEEKDAYS).map(([k, v]) => `<option value="${k}" ${+k === +c.weekday ? "selected" : ""}>${v}</option>`).join("")}</select></td>
    <td><select class="input" id="sc-${job}-hour">${Array.from({ length: 24 }, (_, h) => `<option value="${h}" ${h === +c.hour ? "selected" : ""}>${String(h).padStart(2, "0")}:00</option>`).join("")}</select></td></tr>`;
}
function schedHtml() {
  return `<section class="panel"><div class="sectionhead"><h3>E-posta zamanlaması</h3><span class="muted">Amsterdam saati</span></div>
    ${schedErr ? `<div class="notice" style="margin-bottom:10px">Ayarlar okunamadı (${esc(schedErr)}). Güvenlik kurallarını güncelle. Şimdilik varsayılanlar gösteriliyor.</div>` : ""}
    <div class="tablewrap"><table><thead><tr><th>E-posta</th><th>Durum</th><th>Gün</th><th>Saat</th></tr></thead><tbody>
      ${schedRow("news", "Haber (Nieuws in niveaus)")}${schedRow("weekly", "Haftalık özet")}</tbody></table></div>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="sc-save">Zamanlamayı kaydet</button><span id="sc-msg"></span></div>
    <p class="muted" style="font-size:13px;margin:10px 0 0">Gönderim seçilen saatten sonraki ilk çalışmada olur. GitHub bir çalışmayı atlarsa 48 saat içindeki bir sonraki çalışmada gider; iki kez gitmez.
      ${lastNews ? `Son haber: <b>${esc(lastNews.titel || lastNews.item_id)}</b> · ${esc(lastNews.date)} · ${lastNews.recipients || 0} kişi.` : "Henüz haber gönderilmedi."}</p></section>`;
}
async function saveSched() {
  const msg = document.getElementById("sc-msg"), val = job => ({ enabled: document.getElementById(`sc-${job}-on`).checked, weekday: +document.getElementById(`sc-${job}-day`).value, hour: +document.getElementById(`sc-${job}-hour`).value });
  const next = { news: val("news"), weekly: val("weekly") };
  try { await setDoc(doc(db, "settings", "mail"), { ...next, updated_at: new Date().toISOString(), updated_by: user.uid }); sched = next; msg.innerHTML = `<span class="ok-msg">Kaydedildi</span>`; }
  catch (e) { msg.innerHTML = `<span class="err-msg">${esc(e.code || e.message)}</span>`; }
}

function sel(id, opts, val) {
  return `<select class="input" id="${id}">${Object.entries(opts).map(([k, v]) => `<option value="${k}" ${val === k ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>`;
}

function render() {
  const count = r => users.filter(u => roleOf(u) === r).length;
  // Children can be linked to an adult account; the weekly summary also goes to that parent
  // Groep of child accounts (1-8). Moves up by itself every August (mailer); fix it here when needed.
  const groepOpts = { "": "Seçilmedi", ...Object.fromEntries([1, 2, 3, 4, 5, 6, 7, 8].map(n => ["groep" + n, "Groep " + n])) };
  const parentOpts = { "": "Yok", ...Object.fromEntries(users.filter(u => u.type === "adult").map(u => [u.uid, u.name || u.email || u.uid])) };
  const pending = users.filter(u => statusOf(u) === "pending").length;
  const tabs = `<nav class="seg admintabs" role="tablist">${Object.entries(TABS).map(([k, v]) =>
    `<button role="tab" class="${tab === k ? "on" : ""}" data-tab="${k}" aria-selected="${tab === k}">${v}${k === "hesaplar" && pending ? ` <span class="chip accent">${pending}</span>` : ""}</button>`).join("")}</nav>`;
  app.innerHTML = tabs + (tab === "istatistik" ? statsHtml() : tab === "eposta" ? mailTab() : `
    <section class="kpis">
      <div class="panel kpi"><div class="eyebrow">Onay bekleyen</div><div class="v num" style="color:var(--${users.some(u => statusOf(u) === "pending") ? "accent" : "ink"})">${users.filter(u => statusOf(u) === "pending").length}</div></div>
      <div class="panel kpi"><div class="eyebrow">Hesap</div><div class="v num">${users.length}</div></div>
      <div class="panel kpi"><div class="eyebrow">Öğrenci</div><div class="v num">${users.filter(u => u.type === "child").length}</div></div>
      <div class="panel kpi"><div class="eyebrow">Öğretmen</div><div class="v num">${count("teacher")}</div></div>
    </section>

    <section class="panel"><div class="sectionhead"><h3>Hesaplar</h3><span class="muted">yeni gelenleri "Onaylı" yap, satırdaki Kaydet'e bas</span></div>
      <div class="tablewrap"><table><thead><tr><th>Kişi</th><th>Durum</th><th>Tip</th><th>Rol</th><th>Veli</th><th>Groep</th><th>Son giriş</th><th></th></tr></thead><tbody>
      ${users.map((u, i) => `<tr><td><b>${esc(u.name || "-")}</b><br><span class="muted" style="font-size:13px">${esc(u.email || u.uid)}</span></td>
        <td>${sel("s" + i, STATUSES, statusOf(u))}</td>
        <td>${sel("t" + i, { "": "Seçilmedi", ...TYPES }, u.type || "")}</td>
        <td>${sel("r" + i, ROLES, roleOf(u))}</td>
        <td>${u.type === "child" ? sel("p" + i, parentOpts, u.parent_uid || "") : `<span class="muted">-</span>`}</td>
        <td>${u.type === "child" ? sel("g" + i, groepOpts, u.groep || "") : `<span class="muted">-</span>`}</td>
        <td class="num muted">${fmtDate(u.last_active)}</td>
        <td><button class="btn" data-i="${i}">Kaydet</button> <span id="m${i}"></span></td></tr>`).join("")}
      </tbody></table></div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">Onaylanan kişiye en geç bir saat içinde "kabul edildin" e-postası gider. Kendi admin rolünü kaldırırsan bu ekrana bir daha giremezsin; geri almak için Firebase Console gerekir.</p></section>
    <details class="panel fold"><summary><h3>Roller ne demek?</h3></summary>
      <div class="tablewrap" style="margin-top:8px"><table><tbody>${Object.entries(ROLES).map(([k, v]) => `<tr><td><b>${esc(v)}</b></td><td class="muted">${esc(ROLE_HELP[k])}</td></tr>`).join("")}</tbody></table></div></details>`);
}

// E-mail tab: write an announcement, the schedule, and what was sent
function mailTab() {
  return `
    <section class="panel"><div class="sectionhead"><h3>Duyuru gönder</h3><span class="muted">onaylı herkese e-posta, en geç bir saat içinde</span></div>
      <div class="formgrid" style="grid-template-columns:1fr">
        <div class="field"><label for="n-subj">Konu</label><input class="input" id="n-subj" maxlength="120" placeholder="Örn. Yeni: Groep 5 kelime testi"></div>
        <div class="field"><label for="n-aud">Kime</label><select class="input" id="n-aud"><option value="all">Herkes</option><option value="adult">Sadece yetişkinler</option><option value="child">Sadece öğrenciler</option></select></div>
        <div class="field"><label for="n-body">Mesaj</label><textarea class="input" id="n-body" rows="5" maxlength="4000"></textarea></div>
      </div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="n-send">Duyuruyu kuyruğa ekle</button><span id="n-msg"></span></div>
      ${newsErr ? `<div class="notice" style="margin-top:12px">Duyurular okunamadı (${esc(newsErr)}). Güvenlik kurallarını güncelle.</div>` : ""}
      ${news.length ? `<div class="tablewrap" style="margin-top:14px"><table><tbody>${news.map(n => `<tr><td>${esc(n.subject)} <span class="muted" style="font-size:13px">· ${esc({ all: "herkes", adult: "yetişkinler", child: "öğrenciler" }[n.audience || "all"])}</span></td><td class="num muted">${fmtDate(n.created_at)}</td><td class="r">${n.sent_at ? `<span class="chip ok">gönderildi · ${n.recipients || 0} kişi</span>` : `<span class="chip warn">sırada</span>`}</td></tr>`).join("")}</tbody></table></div>` : ""}
    </section>
    ${schedHtml()}
    ${sentHtml()}`;
}

app.addEventListener("click", async e => {
  const tb = e.target.closest("[data-tab]");
  if (tb) { tab = tb.dataset.tab; history.replaceState(null, "", "#" + tab); render(); return; }
  const wb = e.target.closest("[data-who]");
  if (wb) { who = wb.dataset.who; render(); return; }
  if (e.target.id === "n-send") return queueNews();
  if (e.target.id === "sc-save") return saveSched();
  // Person row: show or hide the details row under it
  const pb = e.target.closest("[data-person]");
  if (pb) { const row = document.getElementById("pd-" + pb.dataset.person), open = row.hidden; row.hidden = !open;
    pb.setAttribute("aria-expanded", String(open)); pb.firstChild.textContent = open ? "▾ " : "▸ "; return; }
  const b = e.target.closest("button[data-i]"); if (!b) return;
  const i = +b.dataset.i, u = users[i], msg = document.getElementById("m" + i);
  const type = document.getElementById("t" + i).value || null, role = document.getElementById("r" + i).value, status = document.getElementById("s" + i).value;
  const pSel = document.getElementById("p" + i), parent_uid = pSel ? (pSel.value || null) : (u.parent_uid || null);
  const gSel = document.getElementById("g" + i), groep = gSel ? (gSel.value || null) : (u.groep || null);
  if (u.uid === user.uid && role !== "admin") { msg.innerHTML = `<span class="err-msg">Kendi admin rolünü buradan kaldıramazsın.</span>`; return; }
  try { await updateDoc(doc(db, "users", u.uid), { type, role, status, parent_uid, groep }); Object.assign(u, { type, role, status, parent_uid, groep }); msg.innerHTML = `<span class="ok-msg">Kaydedildi</span>`; }
  catch (err) { msg.innerHTML = `<span class="err-msg">${esc(err.code || err.message)}</span>`; }
});

// Announcement: stored with sent_at null; the mailer job sends it and fills sent_at
async function queueNews() {
  const subject = document.getElementById("n-subj").value.trim(), body = document.getElementById("n-body").value.trim(), msg = document.getElementById("n-msg");
  if (!subject || !body) { msg.innerHTML = `<span class="err-msg">Konu ve mesaj gerekli.</span>`; return; }
  try {
    await addDoc(collection(db, "announcements"), { subject, body, audience: document.getElementById("n-aud").value, created_at: new Date().toISOString(), created_by: user.uid, sent_at: null });
    msg.innerHTML = `<span class="ok-msg">Kuyruğa eklendi.</span>`; load();
  } catch (err) { msg.innerHTML = `<span class="err-msg">${esc(err.code || err.message)}</span>`; }
}

load();
</script>
</body>
</html>
