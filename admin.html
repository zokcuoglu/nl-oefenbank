<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yönetim · NT2 Oefenbank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><small><a href="./">← Ana sayfa</a></small><h1>Yönetim</h1></div>
    <div class="navlinks" id="ub"></div>
  </div>
</header>
<div class="wrap"><main id="app"><p class="muted">Yükleniyor…</p></main></div>

<script type="module">
// Admin screen: list every account and change its type and role.
// The page is hidden from non-admins, and firestore.rules also refuse their writes.
import { gate, userBox, esc, db, TYPES, ROLES, roleOf } from "./js/core.js";
import { collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const app = document.getElementById("app");
const { user, profile } = await gate({ area: "admin" });
document.getElementById("ub").innerHTML = userBox(user, profile);

const fmtDate = iso => { try { return iso ? new Date(iso).toLocaleDateString("tr-TR", { day: "2-digit", month: "short" }) : "-"; } catch (e) { return "-"; } };
const ROLE_HELP = {
  member: "Kendi çalışmasını ve profilini görür.",
  teacher: "Üye haklarına ek olarak sınıf açar ve sınıfındakilerin özetini görür (sınıf özelliği yakında).",
  admin: "Her şeyi görür, bu ekrandan tip ve rol atar."
};
let users = [];

async function load() {
  try {
    const snap = await getDocs(collection(db, "users"));
    users = snap.docs.map(d => ({ uid: d.id, ...d.data() })).sort((a, b) => (b.last_active || "").localeCompare(a.last_active || ""));
    render();
  } catch (e) { app.innerHTML = `<div class="notice">Kullanıcılar okunamadı: <b>${esc(e.code || e.message)}</b></div>`; }
}

function sel(id, opts, val) {
  return `<select class="input" id="${id}">${Object.entries(opts).map(([k, v]) => `<option value="${k}" ${val === k ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>`;
}

function render() {
  const count = r => users.filter(u => roleOf(u) === r).length;
  app.innerHTML = `
    <section class="kpis">
      <div class="panel kpi"><div class="eyebrow">Hesap</div><div class="v num">${users.length}</div></div>
      <div class="panel kpi"><div class="eyebrow">Çocuk</div><div class="v num">${users.filter(u => u.type === "child").length}</div></div>
      <div class="panel kpi"><div class="eyebrow">Öğretmen</div><div class="v num">${count("teacher")}</div></div>
    </section>
    <section class="panel"><span class="eyebrow">Roller</span>
      <div class="tablewrap" style="margin-top:8px"><table><tbody>${Object.entries(ROLES).map(([k, v]) => `<tr><td><b>${esc(v)}</b></td><td class="muted">${esc(ROLE_HELP[k])}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="panel"><div class="sectionhead"><h3>Hesaplar</h3><span class="muted">değiştirip satırdaki Kaydet'e bas</span></div>
      <div class="tablewrap"><table><thead><tr><th>Kişi</th><th>Tip</th><th>Rol</th><th>Son giriş</th><th></th></tr></thead><tbody>
      ${users.map((u, i) => `<tr><td><b>${esc(u.name || "-")}</b><br><span class="muted" style="font-size:13px">${esc(u.email || u.uid)}</span></td>
        <td>${sel("t" + i, { "": "Seçilmedi", ...TYPES }, u.type || "")}</td>
        <td>${sel("r" + i, ROLES, roleOf(u))}</td>
        <td class="num muted">${fmtDate(u.last_active)}</td>
        <td><button class="btn" data-i="${i}">Kaydet</button> <span id="m${i}"></span></td></tr>`).join("")}
      </tbody></table></div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">Kendi admin rolünü kaldırırsan bu ekrana bir daha giremezsin; geri almak için Firebase Console gerekir.</p></section>`;
}

app.addEventListener("click", async e => {
  const b = e.target.closest("button[data-i]"); if (!b) return;
  const i = +b.dataset.i, u = users[i], msg = document.getElementById("m" + i);
  const type = document.getElementById("t" + i).value || null, role = document.getElementById("r" + i).value;
  if (u.uid === user.uid && role !== "admin") { msg.innerHTML = `<span class="err-msg">Kendi admin rolünü buradan kaldıramazsın.</span>`; return; }
  try { await updateDoc(doc(db, "users", u.uid), { type, role }); Object.assign(u, { type, role }); msg.innerHTML = `<span class="ok-msg">Kaydedildi</span>`; }
  catch (err) { msg.innerHTML = `<span class="err-msg">${esc(err.code || err.message)}</span>`; }
});

load();
</script>
</body>
</html>
