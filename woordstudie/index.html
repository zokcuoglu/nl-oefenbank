<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kelime incelemesi · NL Oefenbank</title>
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../css/site.css">
<style>
[hidden]{display:none!important}
.wrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.wrow:last-child{border-bottom:0} .wrow:hover b{color:var(--accent)}
.hero{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.hero h2{font-size:34px;margin:0}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
.part{background:var(--sunk);border-radius:10px;padding:12px 14px}
.part b{font-family:var(--display);font-size:20px;display:block;margin-bottom:4px}
ol.story{margin:10px 0 0;padding-left:22px;max-width:70ch} ol.story li{margin:4px 0}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:10px;font-size:15px}
.ex b{font-weight:600} .ex span{color:var(--muted)}
@media (max-width:560px){.ex{grid-template-columns:1fr}.ex span{margin-bottom:8px}}
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin-top:12px}
.step{flex:1 1 150px;background:var(--sunk);border-radius:10px;padding:10px 12px;position:relative}
.step b{font-family:var(--display);font-size:18px;display:block}
.step i{display:block;color:var(--accent);font-style:normal;font-size:13.5px;margin:2px 0 4px}
.step span{font-size:13.5px;color:var(--muted)}
.arrow{align-self:center;color:var(--accent);font-size:20px}
@media (max-width:560px){.arrow{transform:rotate(90deg);width:100%;text-align:center}}
.anders{border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin-top:4px}
.weetje{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:12px 16px;max-width:75ch}
.qtr2{font-family:var(--display);font-size:20px;font-weight:700;margin:6px 0 14px}
.typed{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.fb{margin-top:12px;padding:12px 14px;border-radius:8px;font-size:15px}
.fb.good{background:var(--ok-soft)} .fb.wrong{background:var(--bad-soft)}
/* intensity scale: one row per expression, bar length = strength, tag = where you can use it */
.scale{display:grid;gap:8px;margin-top:12px;max-width:720px}
.scale .row{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.scale .deg{font-family:var(--display);font-weight:700;font-size:15px;text-align:center;border-radius:8px;padding:6px 0;color:#fff;background:var(--c)}
.scale .body{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);position:relative;overflow:hidden}
.scale .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--c);width:var(--w)}
.scale .body b{font-size:16px} .scale .body .t{color:var(--muted);font-size:13.5px}
.scale .tag{display:inline-block;margin-left:6px;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);vertical-align:2px}
.scale .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-left:54px}
</style>
<script>
// Watchdog: explain on screen when the login module cannot load (network block)
setTimeout(function () {
  if (window.__coreReady) return;
  var d = document.createElement("div");
  d.setAttribute("style", "position:fixed;left:16px;right:16px;bottom:16px;z-index:200;background:#F7ECD6;color:#7a4e0c;border-radius:10px;padding:14px 16px;font:15px/1.5 system-ui,sans-serif;max-width:640px;margin:0 auto");
  d.innerHTML = "<b>Sayfa yüklenemedi.</b> Giriş sistemi (Google/Firebase) indirilemedi. Ctrl+Shift+R ile yenile. Ağ veya reklam engelleyici Google'ı engelliyor olabilir.";
  document.body.appendChild(d);
}, 10000);
</script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><small><a href="../">← Ana sayfa</a> · <a href="./">Kelime incelemesi</a></small><h1 id="pagetitle">Kelime incelemesi</h1></div>
    <div class="navlinks" id="ub"></div>
  </div>
</header>
<div class="wrap"><main id="app"><p class="muted">Yükleniyor…</p></main></div>

<script type="module">
// Weekly word study: one Dutch word taken apart (parts, history, relatives in other languages, word family,
// examples, a grammar note) with 5 questions at the end. Content: data/woordstudie.json.
// A word is visible from its "datum" (the Tuesday it is mailed, Dutch time); admins see every word at any time.
// "?w=<id>" opens one word. A finished quiz is saved as an attempt of module "woordstudie" (test = word id).
import { gate, userBox, esc, isAdmin, saveAttempt, loadAttempts, markSeen } from "../js/core.js";

const app = document.getElementById("app");
const today = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Amsterdam" }).format(new Date());
const fmtDate = d => new Date(d + "T12:00:00Z").toLocaleDateString("tr-TR", { day: "numeric", month: "long" });
// Typed answers: compared without capitals, punctuation and double spaces
const norm = s => String(s).toLowerCase().replace(/[.,!?;:'"’“”]/g, "").replace(/\s+/g, " ").trim();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// Two pages share this file: the weekly word study (words + idioms, opened by date) and, with "?bolum=gunluk",
// the daily-speech page (patterns only, all open at once, quiz saved as module "gunluk").
const params = new URLSearchParams(location.search);
const GUNLUK = params.get("bolum") === "gunluk";
const MODULE = GUNLUK ? "gunluk" : "woordstudie";
const PAGE = GUNLUK ? "Konuşma kalıpları" : "Kelime incelemesi";
const base = GUNLUK ? "?bolum=gunluk&" : "?";            // keeps the page mode in every link
const wLink = id => base + "w=" + encodeURIComponent(id);
document.title = PAGE + " · NL Oefenbank";
document.querySelector(".brand small").innerHTML = `<a href="../">← Ana sayfa</a> · <a href="${GUNLUK ? "?bolum=gunluk" : "./"}">${PAGE}</a>`;
document.getElementById("pagetitle").textContent = PAGE;
const { user, profile } = await gate({ area: "nt2", title: PAGE, seen: MODULE });
document.getElementById("ub").innerHTML = userBox(user, profile);

let data;
try { data = await (await fetch("../data/woordstudie.json", { cache: "no-cache" })).json(); }
catch (e) { app.innerHTML = `<div class="notice">Kelimeler yüklenemedi: ${esc(e.message)}</div>`; throw e; }
const admin = isAdmin(profile);
const soortOf = w => w.soort || "woord";
// Patterns are open at once on the daily-speech page; words and idioms open on their Tuesday
// The daily-speech page holds the patterns and the things Zana heard during the day ("gunluk": true; open at once, no mail)
const onGunluk = w => soortOf(w) === "kalip" || !!w.gunluk;
const open = w => admin || w.datum <= today || (GUNLUK && onGunluk(w));
const words = data.woorden.filter(open).sort((a, b) => b.datum.localeCompare(a.datum));   // newest first
const attempts = await loadAttempts(user.uid, MODULE).catch(() => []);
const lastOf = id => attempts.find(a => a.test === id);
// A pattern opened from the word study page (old mail links) moves to the daily-speech page, and back.
// Checked before the date rule, because patterns are open on the daily-speech page even before their date.
const asked = data.woorden.find(w => w.id === params.get("w"));
if (asked && onGunluk(asked) !== GUNLUK) location.replace((onGunluk(asked) ? "?bolum=gunluk&" : "?") + "w=" + encodeURIComponent(asked.id));
const word = asked && open(asked) ? asked : undefined;

// ---------- List ----------
// Three kinds share this page and the Tuesday mail: a word ("woord", the main part), a daily-speech
// pattern ("kalip", e.g. "het gaat om") and an idiom ("deyim"). Entries without "soort" are words.
const SOORT = {
  woord: { tab: "Kelimeler", deze: "Bu haftanın kelimesi", btn: "Kelimeyi incele", eyebrow: "Kelime incelemesi",
           intro: "Her salı yeni bir kelime: nasıl kurulduğu, nereden geldiği, başka dillerdeki akrabaları, ailesi ve 5 soru. Yenisi e-postayla da gelir." },
  kalip: { tab: "Günlük kalıplar", deze: "Bu haftanın kalıbı", btn: "Kalıbı incele", eyebrow: "Kalıp incelemesi",
           intro: "Konuşmada çok geçen ama kulakla yakalaması zor kalıplar: anlamları, sık karıştırılanlar, sitedeki gerçek cümleler ve 5 soru." },
  deyim: { tab: "Deyimler", deze: "Bu haftanın deyimi", btn: "Deyimi incele", eyebrow: "Deyim incelemesi",
           intro: "Kelimesi kelimesine ne dediği, gerçek anlamı, kökeni, Türkçe karşılığı ve 5 soru." }
};
const title = w => (w.lidwoord ? w.lidwoord + " " : "") + w.woord;

function renderList() {
  if (GUNLUK) return renderGunluk();
  // Word study page: words and idioms; daily-speech patterns live on their own page (one link card here)
  const tab = params.get("soort") === "deyim" ? "deyim" : "woord";
  const curOf = s => words.find(w => soortOf(w) === s && !w.gunluk && w.datum <= today) || words.find(w => soortOf(w) === s && !w.gunluk);
  const cur = curOf("woord"), deyim = curOf("deyim");
  const list = words.filter(w => soortOf(w) === tab && !w.gunluk);
  app.innerHTML = `
    ${cur ? `<section class="panel"><span class="eyebrow">${SOORT.woord.deze} · ${esc(fmtDate(cur.datum))}</span>
      <div class="hero" style="margin-top:6px"><h2 lang="nl">${esc(title(cur))}</h2><span class="muted">${esc(cur.tr)}</span></div>
      <p style="margin:8px 0 12px;max-width:62ch">${esc(cur.kort)}</p>
      <a class="btn primary" style="text-decoration:none" href="${wLink(cur.id)}">${SOORT.woord.btn}</a>
      ${deyim ? `<a class="wrow" href="${wLink(deyim.id)}" style="margin-top:6px"><span><span class="muted" style="font-size:13px">${SOORT.deyim.deze}</span><br>
        <b lang="nl">${esc(deyim.woord)}</b> <span class="muted">· ${esc(deyim.tr)}</span></span><span class="chip">${SOORT.deyim.btn}</span></a>` : ""}
      <a class="wrow" href="?bolum=gunluk" style="margin-top:6px"><span><span class="muted" style="font-size:13px">Ayrı sayfa</span><br>
        <b>Konuşma kalıpları ve ipuçları</b> <span class="muted">· even, maar, hoor, wel, terecht …</span></span><span class="chip">Aç</span></a></section>` : ""}
    <section class="panel">
      <div class="row" role="tablist" style="gap:6px;flex-wrap:wrap">${["woord", "deyim"].map(k =>
        `<a class="btn${k === tab ? " primary" : ""}" style="text-decoration:none" role="tab" aria-selected="${k === tab}" href="?soort=${k}">${SOORT[k].tab}</a>`).join("")}</div>
      <p class="muted" style="margin:10px 0 8px;max-width:62ch">${SOORT[tab].intro}</p>
      ${list.length ? list.map(w => rowHtml(w, true)).join("") : `<p class="muted">İlki yakında.</p>`}
    </section>`;
}

// One list row: title, Turkish, (date), level and the last score
function rowHtml(w, withDate) {
  const a = lastOf(w.id);
  return `<a class="wrow" href="${wLink(w.id)}">
    <span><b lang="nl">${esc(title(w))}</b> <span class="muted">· ${esc(w.tr)}</span><br>
    <span class="muted" style="font-size:13px">${withDate ? esc(fmtDate(w.datum)) + " · " : ""}${esc(w.niveau)}${withDate && admin && w.datum > today ? ' · <span class="chip warn">henüz yayında değil</span>' : ""}</span></span>
    <span class="chip num">${a ? `${a.score}/${a.total}` : "yeni"}</span></a>`;
}

// Daily-speech page: short tips that point to the pattern pages, then every pattern (oldest first: basics first)
const TIPS = [
  ["Rica ederken çıplak emir kullanma.", "Help me! sert durur. Kun je me even helpen? ya da Kom maar binnen. yumuşaktır.", "even-eens-maar"],
  ["Cevaba küçük bir kelime ekle.", "Ja hoor (tabii), Nee hoor (yok canım), Dat komt wel goed (hallolur).", "hoor-he-toch"],
  ["Daveti kabul ya da reddetmenin hazır cümlesi var.", "Lijkt me leuk! / Wat leuk, maar ik kan helaas niet. Volgende keer graag!", "lijkt-het-je-leuk"],
  ["Yardım teklif ederken terecht.", "Je kunt altijd bij ons terecht. Bir şey sorarken: Bij wie kan ik terecht?", null],
  ["Dinlerken bu küçük kelimeleri atla.", "Anlamı fiil ve isim taşır; even, maar, toch, hoor tonu verir. Önce ana kelimeleri yakala.", null]
];
function renderGunluk() {
  const list = words.filter(w => soortOf(w) === "kalip" && !w.gunluk).sort((a, b) => a.datum.localeCompare(b.datum));
  const heard = words.filter(w => w.gunluk).sort((a, b) => b.datum.localeCompare(a.datum));   // newest first
  const has = id => list.some(w => w.id === id);
  app.innerHTML = `
    <section class="panel"><span class="eyebrow">İpuçları</span>
      <p class="muted" style="margin:6px 0 4px;max-width:62ch">WhatsApp'ta, kulüpte, iş yerinde en çok işine yarayacak beş kural. Her kalıbın sayfasında açıklama, gerçek cümleler, kısa bir diyalog ve 5 soru var.</p>
      <ol class="story">${TIPS.map(([t, x, id]) => `<li><b>${esc(t)}</b> <span lang="nl">${esc(x)}</span>${id && has(id) ? ` <a href="${wLink(id)}">Alıştırma →</a>` : ""}</li>`).join("")}</ol>
      <p class="muted" style="margin:8px 0 0;font-size:14px">${words.some(w => w.id === "terecht") ? `terecht için ayrıntılı sayfa: <a href="./?w=terecht">Kelime incelemesi: terecht</a> · ` : ""}Duruma göre hazır cümleler: <a href="../dersler/?soort=konusma">Günlük konuşma dersleri</a></p></section>
    ${heard.length ? `<section class="panel"><span class="eyebrow">Duyduklarından · ${heard.length}</span>
      <p class="muted" style="margin:6px 0 8px;max-width:62ch">Gün içinde duyulan ve buraya eklenen deyimler, kelimeler ve kalıplar; benzerleriyle birlikte. En yenisi üstte.</p>
      ${heard.map(w => rowHtml(w, false)).join("")}</section>` : ""}
    <section class="panel"><span class="eyebrow">Bütün kalıplar · ${list.length}</span>
      <p class="muted" style="margin:6px 0 8px;max-width:62ch">${SOORT.kalip.intro}</p>
      ${list.length ? list.map(w => rowHtml(w, false)).join("") : `<p class="muted">İlki yakında.</p>`}
    </section>`;
}

// ---------- One word ----------
function renderWord() {
  const w = word;
  document.getElementById("pagetitle").textContent = w.woord;
  markSeen(user.uid, MODULE + ":" + w.id);
  const exList = list => `<div class="ex">${list.map(v => `<b lang="nl">${esc(v.nl)}</b><span>${esc(v.tr)}</span>`).join("")}</div>`;
  const s = soortOf(w), isWoord = s === "woord";
  // Section titles differ per kind; every section below is optional so patterns and idioms can skip
  // the parts that only make sense for a single word (plural, word family …)
  const L = {
    opbouw: w.keten ? "Aynı kelimenin iki yüzü" : s === "deyim" ? "Kelime kelime" : s === "kalip" ? "Kalıbın parçaları" : "Kelimeyi parçala",
    verwant: isWoord ? "Başka dillerdeki akrabaları" : "Başka dillerde",
    familie: isWoord ? "Ailesi ve birleşik kelimeler" : "Benzer ifadeler",
    gramer: isWoord ? "Gramer notu" : "Ne zaman kullanılır?"
  };
  app.innerHTML = `
    <section class="panel">
      <span class="eyebrow">${SOORT[s].eyebrow} · ${esc(fmtDate(w.datum))} · ${esc(w.niveau)}</span>
      <div class="hero" style="margin-top:6px"><h2 lang="nl">${esc(title(w))}</h2>
        ${!isWoord || !w.lidwoord ? "" : w.meervoud ? `<span class="muted" lang="nl">çoğul: ${esc(w.meervoud)}</span>` : `<span class="muted">çoğulu yok</span>`}</div>
      <p style="margin:8px 0 0;font-size:18px"><b>${esc(w.tr)}</b></p>
      <p class="muted" style="margin:4px 0 0" lang="nl"><i>${esc(w.definitie)}</i></p>
      <p style="margin:12px 0 0;max-width:68ch">${esc(w.kort)}</p>
    </section>
    ${w.keten ? `<section class="panel"><span class="eyebrow">Anlam zinciri</span>
      <p class="muted" style="margin:6px 0 0;max-width:68ch">Kelimenin anlamı adım adım nasıl değişti?</p>
      <div class="chain">${w.keten.map((k, i) => `${i ? '<span class="arrow" aria-hidden="true">→</span>' : ""}<div class="step"><b>${esc(k.nl)}</b><i lang="nl">${esc(k.tr)}</i><span>${esc(k.uitleg)}</span></div>`).join("")}</div></section>` : ""}
    ${w.betekenissen ? `<section class="panel"><span class="eyebrow">Anlamları</span>
      <p class="muted" style="margin:6px 0 0;max-width:68ch">Aynı kalıp, cümleye göre farklı anlamlar:</p>
      ${w.betekenissen.map((b, i) => `<div class="anders" style="margin-top:10px"><h3 style="margin:0 0 6px">${i + 1}. ${esc(b.titel)}</h3>
        <p style="margin:0;max-width:68ch">${esc(b.tekst)}</p>${exList(b.voorbeelden)}</div>`).join("")}</section>` : ""}
    ${w.schaal ? `<section class="panel"><span class="eyebrow">${esc(w.schaal.titel)}</span>
      <p class="muted" style="margin:6px 0 0;max-width:68ch">${esc(w.schaal.uitleg)}</p>
      <div class="scale"><div class="ends"><span>${esc(w.schaal.laag || "")}</span><span>${esc(w.schaal.hoog || "")}</span></div>
      ${w.schaal.treden.map(t => { const c = t.sterkte <= 2 ? "var(--ok)" : t.sterkte === 3 ? "var(--blue)" : t.sterkte === 4 ? "var(--warn)" : "var(--bad)";
        return `<div class="row" style="--c:${c};--w:${t.sterkte * 20}%"><div class="deg">${"🌡".repeat(1)}${t.sterkte}</div>
        <div class="body"><b lang="nl">${esc(t.nl)}</b><span class="tag">${esc(t.waar)}</span><div class="t">${esc(t.tr)}</div><div class="bar"></div></div></div>`; }).join("")}</div></section>` : ""}
    ${w.opbouw ? `<section class="panel"><span class="eyebrow">${L.opbouw}</span>
      <div class="parts">${w.opbouw.map(p => `<div class="part"><b lang="nl">${esc(p.deel)}</b>${esc(p.uitleg)}</div>`).join("")}</div></section>` : ""}
    ${w.geschiedenis ? `<section class="panel"><span class="eyebrow">Kökeni</span>
      <ol class="story">${w.geschiedenis.map(x => `<li>${esc(x)}</li>`).join("")}</ol></section>` : ""}
    ${w.verhaal ? `<section class="panel"><span class="eyebrow">Bir hikâye</span><h3 style="margin:4px 0 6px">${esc(w.verhaal.titel)}</h3>
      ${w.verhaal.tekst.map(t => `<p style="margin:6px 0 0;max-width:68ch">${esc(t)}</p>`).join("")}${w.verhaal.voorbeelden ? exList(w.verhaal.voorbeelden) : ""}</section>` : ""}
    ${w.anders ? `<section class="panel"><span class="eyebrow">Dikkat</span><div class="anders"><h3 style="margin:0 0 6px">${esc(w.anders.titel)}</h3>
      <p style="margin:0;max-width:68ch">${esc(w.anders.tekst)}</p>${exList(w.anders.voorbeelden)}</div></section>` : ""}
    ${w.verwant ? `<section class="panel"><span class="eyebrow">${L.verwant}</span>
      <div class="tablewrap" style="margin-top:8px"><table><tbody>${w.verwant.map(v => `<tr><td class="muted">${esc(v.taal)}</td><td><b>${esc(v.woord)}</b></td><td class="muted">${esc(v.uitleg)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
    ${w.opsite ? `<section class="panel"><span class="eyebrow">Sitede geçtiği yerler</span>
      <p class="muted" style="margin:6px 0 0;max-width:68ch">Sitedeki metinlerden gerçek cümleler:</p>
      <div class="ex">${w.opsite.map(v => `<b lang="nl">${esc(v.nl)}</b><span>${esc(v.tr)}<br><span style="font-size:13px">${v.href ? `<a href="../${esc(v.href)}">${esc(v.bron)}</a>` : esc(v.bron)}</span></span>`).join("")}</div></section>` : ""}
    ${w.dialoog ? `<section class="panel"><span class="eyebrow">Kısa diyalog</span>${exList(w.dialoog)}</section>` : ""}
    ${w.familie ? `<section class="panel"><span class="eyebrow">${L.familie}</span>${exList(w.familie)}</section>` : ""}
    <section class="panel"><span class="eyebrow">Örnek cümleler</span>${exList(w.voorbeelden)}</section>
    ${w.gramer ? `<section class="panel"><span class="eyebrow">${L.gramer}</span><h3 style="margin:4px 0 6px">${esc(w.gramer.titel)}</h3>
      <p style="margin:0;max-width:68ch">${esc(w.gramer.tekst)}</p>${exList(w.gramer.voorbeelden)}</section>` : ""}
    ${w.weetje ? `<section class="panel"><span class="eyebrow">Bunu biliyor muydun?</span><p class="weetje" style="margin:8px 0 0">${esc(w.weetje)}</p></section>` : ""}
    <section class="panel" id="quiz"><span class="eyebrow">Kendini dene</span><h2 style="margin-top:4px">${w.vragen.length} soru</h2>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="start">Başla</button>${lastOf(w.id) ? `<span class="chip num">son: ${lastOf(w.id).score}/${lastOf(w.id).total}</span>` : ""}</div></section>
    <p class="muted" style="font-size:12.5px;margin:0">Kaynaklar: ${w.bronnen.map(esc).join(" · ")}</p>`;
  document.getElementById("start").onclick = startQuiz;
}

// ---------- Quiz: multiple choice first, then typing ----------
let run = null;
function startQuiz() {
  const by = t => shuffle(word.vragen.filter(q => q.type === t));
  run = { qs: [...by("mc"), ...by("type")], i: 0, answers: [], started: Date.now() };
  renderQ();
}
function renderQ() {
  const q = run.qs[run.i], box = document.getElementById("quiz");
  const head = `<span class="eyebrow">Soru ${run.i + 1} / ${run.qs.length}</span>`;
  if (q.type === "mc") {
    q._opts = shuffle(q.opties.map((t, i) => ({ t, ok: i === q.juist })));
    box.innerHTML = `${head}<p class="qtr2">${esc(q.vraag)}</p><div style="display:grid;gap:8px">${q._opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="mark">${"ABC"[i]}</span><span lang="nl">${esc(o.t)}</span></button>`).join("")}</div><div id="fb"></div>`;
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const o = q._opts[+b.dataset.i];
      box.querySelectorAll(".opt").forEach((x, i) => { x.disabled = true; if (q._opts[i].ok) x.classList.add("right"); });
      if (!o.ok) b.classList.add("wrongpick");
      done(q, o.t, o.ok, q.opties[q.juist]);
    });
  } else {
    box.innerHTML = `${head}<span class="eyebrow" style="display:block;margin-top:6px">Hollandaca yaz</span><p class="qtr2">${esc(q.tr)}</p>
      <input class="typed" id="typed" lang="nl" autocomplete="off" spellcheck="false" placeholder="Cevabını yaz, Enter'a bas">
      <div class="row" style="margin-top:12px"><button class="btn primary" id="check">Kontrol et</button></div><div id="fb"></div>`;
    const inp = document.getElementById("typed"); inp.focus();
    const check = () => { if (!inp.value.trim()) return; inp.disabled = true; document.getElementById("check").remove();
      done(q, inp.value.trim(), q.antwoorden.some(a => norm(a) === norm(inp.value)), q.antwoorden[0]); };
    document.getElementById("check").onclick = check;
    inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); check(); } };
  }
  box.scrollIntoView({ block: "start" });
}
function done(q, given, correct, model) {
  run.answers.push({ qid: q.id, chosen: given.slice(0, 200), correct });
  const last = run.i === run.qs.length - 1;
  document.getElementById("fb").innerHTML = `<div class="fb ${correct ? "good" : "wrong"}"><b>${correct ? "Doğru." : "Olmadı."}</b>
    <span style="display:block;font-weight:600;margin:4px 0" lang="nl">${esc(model)}</span>${esc(q.uitleg)}</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="next">${last ? "Sonucu gör" : "Sonraki"}</button></div>`;
  const next = document.getElementById("next");
  next.onclick = () => { if (last) finish(); else { run.i++; renderQ(); } };
  setTimeout(() => next.focus(), 50);
}
async function finish() {
  const score = run.answers.filter(a => a.correct).length;
  const attempt = { kind: MODULE, test: word.id, title: word.woord, started_at: new Date(run.started).toISOString(), finished_at: new Date().toISOString(),
    duration_s: Math.round((Date.now() - run.started) / 1000), score, total: run.qs.length, answers: run.answers };
  let saved = true;
  try { await saveAttempt(user.uid, MODULE, attempt); attempts.unshift(attempt); } catch (e) { console.warn(e); saved = false; }
  document.getElementById("quiz").innerHTML = `<span class="eyebrow">Sonuç</span><div class="scorebig num" style="margin-top:6px">${score} / ${run.qs.length}</div>
    ${saved ? "" : `<div class="notice" style="margin-top:10px">Sonuç kaydedilemedi.</div>`}
    <div class="row" style="margin-top:14px"><button class="btn primary" id="again">Tekrar çöz</button><a class="btn" href="${GUNLUK ? "?bolum=gunluk" : "./"}">${GUNLUK ? "Bütün kalıplar" : "Bütün kelimeler"}</a></div>`;
  document.getElementById("again").onclick = startQuiz;
}

if (word) renderWord();
else {
  renderList();
  // Wish box under the list (adults only): which word, idiom or pattern should come next
  const box = document.createElement("div"); app.appendChild(box);
  import("../js/talep.js").then(m => m.mountTalep(box, { user, profile, page: GUNLUK ? "gunluk" : "woordstudie", soort: GUNLUK ? "kalip" : "kelime" }));
}
</script>
